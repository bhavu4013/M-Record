<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Data Analysis Portal</title> 
    <script src="https://cdn.tailwindcss.com"></script> 
</head> 
<body class="bg-slate-100 p-4 min-h-screen flex flex-col items-center justify-between pb-20"> 

<!-- Main Container Card --> 
<div class="max-w-md w-full bg-white p-6 rounded-xl shadow-lg space-y-4 my-auto"> 
    <h2 class="text-xl font-bold text-center text-slate-800 tracking-wide">Data Analysis Portal</h2> 

    <!-- ANALYSIS SECTION --> 
    <div id="analysisSection" class="space-y-4 w-full"> 
        <div class="space-y-3"> 
            <!-- Top Main Toggle (Selected Market vs Merged) --> 
            <div class="flex bg-slate-200 p-1 rounded-lg gap-1"> 
                <label class="flex-1 text-center cursor-pointer py-1.5 rounded-md transition-all text-xs font-bold analysis-main-tab bg-indigo-600 text-white shadow-sm" id="analysisTabSelected"> 
                    <input type="radio" name="analysisType" value="selected" checked class="hidden"> Selected Market 
                </label> 
                <label class="flex-1 text-center cursor-pointer py-1.5 rounded-md transition-all text-xs font-bold analysis-main-tab text-slate-700" id="analysisTabMerged"> 
                    <input type="radio" name="analysisType" value="merged" class="hidden"> Merged 
                </label> 
            </div> 

            <!-- Conditional Market Dropdown --> 
            <div id="analysisMarketContainer" class="space-y-1"> 
                <select id="analysisMarketSelect" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none bg-white font-semibold text-slate-800"> 
                    <option value="">Select Market</option> 
                </select> 
            </div> 

            <!-- Minimal Segmented Pill Filters (Open, Close, Total, Diff, More) --> 
            <div class="grid grid-cols-5 gap-1 text-xs font-bold"> 
                <button type="button" data-view="Open" class="analysis-view-btn bg-blue-600 text-white py-1.5 rounded-lg shadow-sm text-center transition">Open</button> 
                <button type="button" data-view="Close" class="analysis-view-btn bg-slate-200 text-slate-700 py-1.5 rounded-lg text-center hover:bg-slate-300 transition">Close</button> 
                <button type="button" data-view="Total" class="analysis-view-btn bg-slate-200 text-slate-700 py-1.5 rounded-lg text-center hover:bg-slate-300 transition">Total</button> 
                <button type="button" data-view="Diff" class="analysis-view-btn bg-slate-200 text-slate-700 py-1.5 rounded-lg text-center hover:bg-slate-300 transition">Diff</button> 
                <button type="button" data-view="More" class="analysis-view-btn bg-slate-200 text-slate-700 py-1.5 rounded-lg text-center hover:bg-slate-300 transition">More ▾</button> 
            </div> 

            <!-- More Sub-Filters Container --> 
            <div id="moreSubFiltersContainer" class="hidden grid grid-cols-4 gap-1 text-[11px] font-bold pt-1"> 
                <button type="button" data-subview="FamilyJodi" class="more-sub-btn bg-indigo-600 text-white py-1 rounded shadow-sm text-center transition">Family Jodi</button> 
                <button type="button" data-subview="FamilyPanna" class="more-sub-btn bg-slate-200 text-slate-700 py-1 rounded text-center hover:bg-slate-300 transition">Family Panna</button> 
                <button type="button" data-subview="OddEven" class="more-sub-btn bg-slate-200 text-slate-700 py-1 rounded text-center hover:bg-slate-300 transition">Odd/Even</button> 
                <button type="button" data-subview="PanelType" class="more-sub-btn bg-slate-200 text-slate-700 py-1 rounded text-center hover:bg-slate-300 transition">Panel Type</button> 
            </div> 

            <!-- Family Panna Digit Selection Buttons --> 
            <div id="familyPannaDigitContainer" class="hidden space-y-1.5 pt-1"> 
                <div class="text-[11px] font-bold text-slate-600">Select Digit (0-9):</div> 
                <div class="grid grid-cols-5 gap-1 text-xs font-bold"> 
                    <button type="button" data-digit="1" class="fp-digit-btn bg-slate-200 text-slate-700 py-1 rounded text-center transition">1</button> 
                    <button type="button" data-digit="2" class="fp-digit-btn bg-slate-200 text-slate-700 py-1 rounded text-center transition">2</button> 
                    <button type="button" data-digit="3" class="fp-digit-btn bg-slate-200 text-slate-700 py-1 rounded text-center transition">3</button> 
                    <button type="button" data-digit="4" class="fp-digit-btn bg-slate-200 text-slate-700 py-1 rounded text-center transition">4</button> 
                    <button type="button" data-digit="5" class="fp-digit-btn bg-slate-200 text-slate-700 py-1 rounded text-center transition">5</button> 
                    <button type="button" data-digit="6" class="fp-digit-btn bg-slate-200 text-slate-700 py-1 rounded text-center transition">6</button> 
                    <button type="button" data-digit="7" class="fp-digit-btn bg-slate-200 text-slate-700 py-1 rounded text-center transition">7</button> 
                    <button type="button" data-digit="8" class="fp-digit-btn bg-slate-200 text-slate-700 py-1 rounded text-center transition">8</button> 
                    <button type="button" data-digit="9" class="fp-digit-btn bg-slate-200 text-slate-700 py-1 rounded text-center transition">9</button> 
                    <button type="button" data-digit="0" class="fp-digit-btn bg-indigo-600 text-white py-1 rounded text-center transition">0</button> 
                </div> 
            </div> 

            <!-- Header Info Bar --> 
            <div class="flex justify-between items-center text-xs font-bold px-1 pt-1 text-slate-700"> 
                <span id="analysisHeaderTitle" class="text-indigo-700">⏳ ALL MARKETS (MERGED) (OPEN)</span> 
                <span id="openTotalLogs" class="text-slate-500">0 ગેમ્સ ડેટા</span> 
            </div> 

            <!-- Three Segment Cards (TOP, MID, RECENT) --> 
            <div class="grid grid-cols-3 gap-2 text-center" id="analysisCardsContainer"> 
                <div class="bg-white border-2 border-orange-400 rounded-xl p-2 space-y-1 shadow-sm"> 
                    <div class="text-orange-600 font-extrabold text-xs" id="topCardTitle">🔥 TOP</div> 
                    <div id="topAnkVal" class="text-sm font-black text-slate-800 truncate">0</div> 
                    <div id="topMaxVal" class="text-[11px] text-slate-600 font-bold">Max: 0</div> 
                    <div id="topListContainer" class="bg-orange-50 border border-orange-200 text-orange-800 text-[10px] font-mono py-1 px-0.5 rounded font-bold break-words">[]</div> 
                </div> 
                <div class="bg-white border-2 border-indigo-400 rounded-xl p-2 space-y-1 shadow-sm"> 
                    <div class="text-indigo-600 font-extrabold text-xs" id="midCardTitle">💠 MID</div> 
                    <div id="midAnkVal" class="text-sm font-black text-slate-800 truncate">0</div> 
                    <div id="midMaxVal" class="text-[11px] text-slate-600 font-bold">Max: 0</div> 
                    <div id="midListContainer" class="bg-indigo-50 border border-indigo-200 text-indigo-800 text-[10px] font-mono py-1 px-0.5 rounded font-bold break-words">[]</div> 
                </div> 
                <div class="bg-white border-2 border-emerald-400 rounded-xl p-2 space-y-1 shadow-sm"> 
                    <div class="text-emerald-600 font-extrabold text-xs" id="recentCardTitle">⚡ RECENT</div> 
                    <div id="recentAnkVal" class="text-sm font-black text-slate-800 truncate">0</div> 
                    <div id="recentMaxVal" class="text-[11px] text-slate-600 font-bold">Max: 0</div> 
                    <div id="recentListContainer" class="bg-emerald-50 border border-emerald-200 text-emerald-800 text-[10px] font-mono py-1 px-0.5 rounded font-bold break-words">[]</div> 
                </div> 
            </div> 

            <!-- GAP GRID SECTION --> 
            <div class="space-y-1 pt-1"> 
                <div class="text-xs font-bold text-slate-600" id="gridTitleLabel">📊 Gap:</div> 
                <div id="gapGridContainer" class="space-y-1.5"></div> 
            </div> 
        </div> 
    </div> 
</div> 

<!-- Family Panna Group Breakdown Popup Modal --> 
<div id="fpDetailModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center hidden p-4 z-50"> 
    <div class="bg-white p-5 rounded-2xl max-w-sm w-full space-y-4 shadow-2xl"> 
        <div class="flex justify-between items-center border-b pb-2"> 
            <h3 id="fpModalTitle" class="text-sm font-bold text-slate-800">Group Details</h3> 
            <button type="button" id="closeFpModalBtn" class="text-slate-400 hover:text-slate-600 font-bold text-sm bg-slate-100 hover:bg-slate-200 w-7 h-7 rounded-full flex items-center justify-center transition">✕</button> 
        </div> 
        <div id="fpModalContent" class="space-y-2 max-h-[60vh] overflow-y-auto text-xs pr-1"></div> 
        <button type="button" id="closeFpModalFooterBtn" class="w-full bg-slate-800 text-white py-2 rounded-xl font-bold text-xs hover:bg-slate-900 transition shadow-sm">Close</button> 
    </div> 
</div> 

<!-- Bottom Navigation Bar --> 
<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-lg flex justify-around p-2 max-w-md mx-auto z-40 rounded-t-2xl"> 
    <a href="index.html" class="flex-1 flex flex-col items-center py-2 text-slate-400 font-semibold transition"> 
        <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg> 
        <span class="text-xs">Logger</span> 
    </a> 
    <a href="analysis.html" class="flex-1 flex flex-col items-center py-2 text-blue-600 font-bold transition"> 
        <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2m0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg> 
        <span class="text-xs">Analysis</span> 
    </a> 
    <a href="shortlist.html" class="flex-1 flex flex-col items-center py-2 text-slate-400 font-semibold transition"> 
        <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> 
        <span class="text-xs">Shortlist</span> 
    </a> 
</div> 

<script type="module"> 
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"; 
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"; 

    const firebaseConfig = { 
        apiKey: "AIzaSyC7lVQlcPhEGv2V-UwlQ7d6Dq-eXb8boqQ", 
        authDomain: "m-record-f9c51.firebaseapp.com", 
        projectId: "m-record-f9c51", 
        storageBucket: "m-record-f9c51.firebasestorage.app", 
        messagingSenderId: "479303152172", 
        appId: "1:479303152172:web:3cc53dcecc9e8ce1ebd789" 
    }; 
    const app = initializeApp(firebaseConfig); 
    const db = getFirestore(app); 

    let marketsList = []; 
    let currentAnalysisView = 'Open'; 
    let currentMoreSubView = 'FamilyJodi'; 
    let selectedFamilyPannaDigit = "0"; 
    let globalAllRecords = []; 

    async function loadAnalysisMarkets() { 
        const analysisMarketSelect = document.getElementById('analysisMarketSelect'); 
        try { 
            const querySnapshot = await getDocs(collection(db, "markets")); 
            analysisMarketSelect.innerHTML = '<option value="">Select Market</option>'; 
            marketsList = []; 
            querySnapshot.forEach((docSnap) => { marketsList.push({ id: docSnap.id, ...docSnap.data() }); }); 
            marketsList.sort((a, b) => (a.openTime || "23:59").localeCompare(b.openTime || "23:59")); 
            marketsList.forEach(mData => { 
                let opt = document.createElement('option'); 
                opt.value = mData.name; opt.textContent = mData.name; 
                analysisMarketSelect.appendChild(opt); 
            }); 
            if (marketsList.length > 0 && analysisMarketSelect.value === "") { 
                analysisMarketSelect.value = marketsList[0].name; 
            } 
            loadAnalysisData(); 
        } catch (e) { console.log("Markets load error:", e); } 
    } 
    loadAnalysisMarkets(); 

    const analysisViewBtns = document.querySelectorAll('.analysis-view-btn'); 
    const moreSubFiltersContainer = document.getElementById('moreSubFiltersContainer'); 
    const familyPannaDigitContainer = document.getElementById('familyPannaDigitContainer'); 

    analysisViewBtns.forEach(btn => { 
        btn.addEventListener('click', (e) => { 
            analysisViewBtns.forEach(b => b.className = "analysis-view-btn bg-slate-200 text-slate-700 py-1.5 rounded-lg text-center hover:bg-slate-300 transition"); 
            e.target.className = "analysis-view-btn bg-blue-600 text-white py-1.5 rounded-lg shadow-sm text-center transition"; 
            currentAnalysisView = e.target.getAttribute('data-view'); 
            if (currentAnalysisView === 'More') { 
                moreSubFiltersContainer.classList.remove('hidden'); 
                if (currentMoreSubView === 'FamilyPanna') familyPannaDigitContainer.classList.remove('hidden'); 
            } else { 
                moreSubFiltersContainer.classList.add('hidden'); familyPannaDigitContainer.classList.add('hidden'); 
            } 
            loadAnalysisData(); 
        }); 
    }); 

    const moreSubBtns = document.querySelectorAll('.more-sub-btn'); 
    moreSubBtns.forEach(btn => { 
        btn.addEventListener('click', (e) => { 
            moreSubBtns.forEach(b => b.className = "more-sub-btn bg-slate-200 text-slate-700 py-1 rounded text-center hover:bg-slate-300 transition"); 
            e.target.className = "more-sub-btn bg-indigo-600 text-white py-1 rounded shadow-sm text-center transition"; 
            currentMoreSubView = e.target.getAttribute('data-subview'); 
            if (currentMoreSubView === 'FamilyPanna') familyPannaDigitContainer.classList.remove('hidden'); 
            else familyPannaDigitContainer.classList.add('hidden'); 
            loadAnalysisData(); 
        }); 
    }); 

    document.querySelectorAll('.fp-digit-btn').forEach(btn => { 
        btn.addEventListener('click', (e) => { 
            document.querySelectorAll('.fp-digit-btn').forEach(b => b.className = "fp-digit-btn bg-slate-200 text-slate-700 py-1 rounded text-center transition"); 
            e.target.className = "fp-digit-btn bg-indigo-600 text-white py-1 rounded text-center transition"; 
            selectedFamilyPannaDigit = e.target.getAttribute('data-digit'); 
            loadAnalysisData(); 
        }); 
    }); 

    const closeFpModal = () => document.getElementById('fpDetailModal').classList.add('hidden'); 
    document.getElementById('closeFpModalBtn').addEventListener('click', closeFpModal); 
    document.getElementById('closeFpModalFooterBtn').addEventListener('click', closeFpModal); 

    const analysisTypeRadios = document.querySelectorAll('input[name="analysisType"]'); 
    const analysisMarketContainer = document.getElementById('analysisMarketContainer'); 
    analysisTypeRadios.forEach(radio => { 
        radio.addEventListener('change', (e) => { 
            const val = e.target.value; 
            document.querySelectorAll('.analysis-main-tab').forEach(tab => tab.className = "flex-1 text-center cursor-pointer py-1.5 rounded-md transition-all text-xs font-bold analysis-main-tab text-slate-700 bg-transparent"); 
            document.getElementById(`analysisTab${val.charAt(0).toUpperCase() + val.slice(1)}`).className = "flex-1 text-center cursor-pointer py-1.5 rounded-md transition-all text-xs font-bold analysis-main-tab bg-indigo-600 text-white shadow-sm"; 
            if (val === 'selected') analysisMarketContainer.classList.remove('hidden'); 
            else analysisMarketContainer.classList.add('hidden'); 
            loadAnalysisData(); 
        }); 
    }); 

    document.getElementById('analysisMarketSelect').addEventListener('change', loadAnalysisData); 

    async function loadAnalysisData() { 
        const analysisType = document.querySelector('input[name="analysisType"]:checked').value; 
        let selectedMarket = document.getElementById('analysisMarketSelect').value; 
        if (analysisType === 'selected' && !selectedMarket && marketsList.length > 0) { 
            selectedMarket = marketsList[0].name; 
            document.getElementById('analysisMarketSelect').value = selectedMarket; 
        } 

        const analysisHeaderTitle = document.getElementById('analysisHeaderTitle'); 
        const openTotalLogs = document.getElementById('openTotalLogs'); 
        const topCardTitle = document.getElementById('topCardTitle'); 
        const midCardTitle = document.getElementById('midCardTitle'); 
        const recentCardTitle = document.getElementById('recentCardTitle'); 
        const topAnkVal = document.getElementById('topAnkVal'); 
        const topMaxVal = document.getElementById('topMaxVal'); 
        const topListContainer = document.getElementById('topListContainer'); 
        const midAnkVal = document.getElementById('midAnkVal'); 
        const midMaxVal = document.getElementById('midMaxVal'); 
        const midListContainer = document.getElementById('midListContainer'); 
        const recentAnkVal = document.getElementById('recentAnkVal'); 
        const recentMaxVal = document.getElementById('recentMaxVal'); 
        const recentListContainer = document.getElementById('recentListContainer'); 
        const gapGridContainer = document.getElementById('gapGridContainer'); 
        const gridTitleLabel = document.getElementById('gridTitleLabel'); 

        if (analysisType === 'selected' && !selectedMarket) { 
            openTotalLogs.innerText = "0 ગેમ્સ ડેટા"; 
            analysisHeaderTitle.innerText = `SELECT A MARKET (${currentAnalysisView.toUpperCase()})`; 
            return; 
        } 

        analysisHeaderTitle.innerText = `⏳ ${(analysisType === 'merged') ? "ALL MARKETS (MERGED)" : selectedMarket.toUpperCase()} (${currentAnalysisView.toUpperCase()})`; 
        gridTitleLabel.innerText = `📊 ${currentAnalysisView} Analysis:`; 

        try { 
            const querySnapshot = await getDocs(collection(db, "matka_records")); 
            let records = []; 
            const familyPannaGroupsMap = { 
                "222": ["777", "222", "227", "277"], "444": ["444", "999", "499", "449"], "666": ["111", "666", "166", "116"], "888": ["888", "333", "338", "388"], "000": ["555", "000", "500", "550"], 
                "123": ["128", "123", "678", "178", "236", "367", "137", "268"], "345": ["345", "890", "390", "340", "480", "458", "589", "359"], "567": ["157", "567", "120", "260", "670", "170", "256", "125"], "789": ["789", "234", "248", "478", "239", "289", "347", "379"], "456": ["456", "145", "140", "190", "690", "460", "159", "569"], "470": ["470", "240", "290", "790", "245", "259", "579", "457"], "246": ["246", "269", "129", "124", "147", "179", "679", "467"], "369": ["346", "369", "148", "134", "139", "189", "689", "468"], "130": ["130", "180", "680", "360", "356", "568", "158", "135"], "230": ["230", "280", "780", "370", "258", "235", "357", "578"], "100": ["100", "600", "155", "556", "560", "150"], "200": ["200", "700", "255", "557", "570", "250"], "300": ["300", "800", "355", "558", "580", "350"], "400": ["400", "900", "455", "559", "590", "450"], "366": ["366", "668", "113", "118", "168", "136"], "330": ["335", "330", "588", "880", "380", "358"], "110": ["110", "115", "660", "566", "156", "160"], "440": ["445", "440", "599", "990", "490", "459"], "220": ["220", "225", "770", "577", "257", "270"], "334": ["339", "334", "889", "488", "348", "389"], "399": ["399", "899", "344", "448", "489", "349"], "377": ["778", "377", "228", "223", "237", "278"], "477": ["779", "477", "229", "224", "247", "279"], "144": ["446", "144", "699", "199", "149", "469"], "177": ["177", "677", "122", "226", "267", "127"], "114": ["119", "114", "669", "466", "146", "169"], "133": ["336", "133", "688", "188", "138", "368"], "233": ["337", "233", "788", "288", "238", "378"], "266": ["266", "667", "112", "117", "167", "126"], "244": ["447", "244", "799", "299", "249", "479"] 
            }; 
            const digitFamilyPannaMap = { 
                "1": ["222", "123", "470", "100", "330", "399", "114"], "2": ["444", "345", "246", "200", "110", "377", "133"], "3": ["666", "567", "369", "300", "440", "477", "233"], "4": ["888", "789", "130", "400", "220", "144", "266"], "5": ["000", "456", "230", "366", "334", "177", "244"], "6": ["222", "123", "470", "100", "330", "399", "114"], "7": ["444", "345", "246", "200", "110", "377", "133"], "8": ["666", "567", "369", "300", "440", "477", "233"], "9": ["888", "789", "130", "400", "220", "144", "266"], "0": ["000", "456", "230", "366", "334", "177", "244"] 
            }; 

            querySnapshot.forEach((docSnap) => { 
                let data = docSnap.data(); 
                let matchMarket = (analysisType === 'merged') || (data.marketName === selectedMarket); 
                if (matchMarket && data.date && data.marketName) { 
                    let marketObj = marketsList.find(m => m.name === data.marketName); 
                    let openTime = marketObj ? marketObj.openTime || "00:00" : "00:00"; 
                    let targetVal = null; 
                    if (currentAnalysisView === 'Open' && data.openAnk !== undefined && data.openAnk !== '') targetVal = parseInt(data.openAnk); 
                    else if (currentAnalysisView === 'Close' && data.closeAnk !== undefined && data.closeAnk !== '') targetVal = parseInt(data.closeAnk); 
                    else if (currentAnalysisView === 'Total' && data.openAnk !== undefined && data.closeAnk !== undefined) targetVal = (parseInt(data.openAnk) + parseInt(data.closeAnk)) % 10; 
                    else if (currentAnalysisView === 'Diff' && data.openAnk !== undefined && data.closeAnk !== undefined) targetVal = (10 + parseInt(data.closeAnk) - parseInt(data.openAnk)) % 10; 

                    if (targetVal !== null && !isNaN(targetVal) || currentAnalysisView === 'More') { 
                        let fKey = null, fpKey = null, pannaToTest = data.openPana; 
                        if (pannaToTest && pannaToTest.length === 3) { 
                            for (let [gKey, pList] of Object.entries(familyPannaGroupsMap)) { 
                                if (pList.includes(pannaToTest)) { fpKey = gKey; break; } 
                            } 
                        } 
                        if (currentAnalysisView === 'More' && currentMoreSubView === 'FamilyJodi' && data.openAnk !== undefined && data.closeAnk !== undefined) { 
                            let jodi = `${data.openAnk}${data.closeAnk}`; 
                            const familyGroupsMap = { 
                                "11": ["11", "16", "61", "66"], "12": ["12", "17", "21", "26", "62", "67", "71", "76"], "13": ["13", "18", "31", "36", "63", "68", "81", "86"], "14": ["14", "19", "41", "46", "64", "69", "91", "96"], "15": ["10", "15", "50", "55", "01", "06", "51", "60"], "22": ["22", "27", "72", "77"], "23": ["23", "28", "32", "37", "73", "78", "82", "87"], "24": ["24", "29", "42", "47", "74", "79", "92", "97"], "25": ["20", "25", "52", "57", "70", "75", "02", "07"], "33": ["33", "38", "83", "88"], "34": ["34", "39", "43", "48", "84", "89", "93", "98"], "35": ["30", "35", "53", "58", "80", "85", "03", "08"], "44": ["44", "49", "94", "99"], "45": ["40", "45", "54", "59", "90", "95", "04", "09"], "55": ["00", "05", "50", "55"] 
                            }; 
                            for (let [gKey, jList] of Object.entries(familyGroupsMap)) { 
                                if (jList.includes(jodi)) { fKey = gKey; break; } 
                            } 
                        } 
                        records.push({ date: data.date, marketName: data.marketName, openTime, val: targetVal, familyKey: fKey, familyPannaKey: fpKey, openPana: data.openPana, openAnk: data.openAnk, closeAnk: data.closeAnk, openType: data.openType || '-' }); 
                    } 
                } 
            }); 

            globalAllRecords = records; 
            records.sort((a, b) => new Date(a.date) - new Date(b.date) || a.openTime.localeCompare(b.openTime)); 
            openTotalLogs.innerText = `${records.length} ગેમ્સ ડેટા`; 

            if (currentAnalysisView === 'More') { 
                gridTitleLabel.innerText = `📊 More Analysis (${currentMoreSubView}):`; 
                if (currentMoreSubView === 'FamilyJodi') { 
                    topCardTitle.innerText = "🔥 TOP"; midCardTitle.innerText = "💠 MID"; recentCardTitle.innerText = "⚡ RECENT"; 
                    const allGroupKeys = ["11", "12", "13", "14", "15", "22", "23", "24", "25", "33", "34", "35", "44", "45", "55"]; 
                    let groupStats = {};

                    }); 
                    gapGridContainer.appendChild(gridWrapper); 
                } else if (currentMoreSubView === 'FamilyPanna') { 
                    topCardTitle.innerText = "🔥 TOP (2)"; midCardTitle.innerText = "💠 MID (3)"; recentCardTitle.innerText = "⚡ RECENT (2)"; 
                    let allowedGroups = digitFamilyPannaMap[selectedFamilyPannaDigit] || []; 
                    let fpStats = {}; 
                    allowedGroups.forEach(k => fpStats[k] = { occurrences: [], currentDelay: 0, maxDelay: 0, lastSeen: -1 }); 
                    records.forEach((rec, idx) => { if (rec.familyPannaKey && fpStats[rec.familyPannaKey]) fpStats[rec.familyPannaKey].occurrences.push(idx); }); 
                    let totalLen = records.length; 
                    allowedGroups.forEach(k => { 
                        let occs = fpStats[k].occurrences; 
                        fpStats[k].currentDelay = occs.length === 0 ? totalLen : totalLen - 1 - occs[occs.length - 1]; 
                        if (occs.length > 0) fpStats[k].lastSeen = occs[occs.length - 1]; 
                        let gaps = occs.length > 0 ? [occs[0]] : [totalLen]; 
                        for (let j = 1; j < occs.length; j++) gaps.push(occs[j] - occs[j - 1] - 1); 
                        if (occs.length > 0) gaps.push(totalLen - 1 - occs[occs.length - 1]);

                    }); 
                    let fpListArr = allowedGroups.map(k => ({ group: k, ...fpStats[k] }));

                    midAnkVal.innerText = fpMid3[0] ? fpMid3[0].currentDelay : 0; midMaxVal.innerText = `Max: ${fpMid3[0] ? fpMid3[0].maxDelay : 0}`; midListContainer.innerText = `[${fpMid3.map(x => x.group).join(', ')}]`;

                    records.forEach(r => { if (r.val !== null && !isNaN(r.val)) { if (r.val % 2 === 0) evenCount++; else oddCount++; } }); 
                    let total = oddCount + evenCount, oddPct = total > 0 ? Math.round((oddCount / total) * 100) : 0, evenPct = total > 0 ? Math.round((evenCount / total) * 100) : 0; 
                    topAnkVal.innerText = oddCount; topMaxVal.innerText = `Max: ${oddPct}%`; topListContainer.innerText = `[Odd Stats]`;

                if (occs.length > 0) gaps.push(totalLen - 1 - occs[occs.length - 1]);
