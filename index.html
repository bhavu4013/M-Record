&lt;script type=&quot;module&quot;&gt;
import { initializeApp } from &quot;https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js&quot;;
import { getFirestore, collection, getDocs } from &quot;https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js&quot;;

const firebaseConfig={
 apiKey:&quot;AIzaSyC7lVQlcPhEGv2V-UwlQ7d6Dq-eXb8boqQ&quot;,
 authDomain:&quot;m-record-f9c51.firebaseapp.com&quot;,
 projectId:&quot;m-record-f9c51&quot;,

};
const db=getFirestore(initializeApp(firebaseConfig));
const marketSelect=document.getElementById('marketSelect'),jodiGrid=document.getElementById('jodiGrid'),digitGrid=document.getElementById('digitGrid'),statusEl=document.getElementById('status');
let allRows=[], stats={}, top10=[], recent10=[];

const digit=v=&gt;{ if(v===undefined||v===null||v==='') return null; const n=parseInt(v,10); return Number.isFinite(n)?((n%10)+10)%10:null; };
const jodiOf=r=&gt;{const o=digit(r.openAnk),c=digit(r.closeAnk);return o===null||c===null?null:`${o}${c}`;};
const timeMin=s=&gt;{if(!s)return 1439;const m=String(s).match(/(\d{1,2}):(\d{2})/);return m?parseInt(m[1])*60+parseInt(m[2]):1439;};
function sortRows(rows){return rows.slice().sort((a,b)=&gt;new Date(a.date)-new Date(b.date)||timeMin(a.openTime)-timeMin(b.openTime));}

async function load(){
 statusEl.textContent='Loading Firebase data...';
 const [mSnap,rSnap]=await Promise.all([getDocs(collection(db,'markets')),getDocs(collection(db,'matka_records'))]);
 marketSelect.innerHTML='&lt;option value=&quot;ALL_MERGED&quot;&gt;ALL MARKETS (MERGED)&lt;/option&gt;';
 const markets=[];mSnap.forEach(d=&gt;markets.push({id:d.id,...d.data()}));
 markets.sort((a,b)=&gt;timeMin(a.openTime)-timeMin(b.openTime));
 markets.forEach(m=&gt;{const o=document.createElement('option');o.value=m.name;o.textContent=m.name;marketSelect.appendChild(o);});
 allRows=[];rSnap.forEach(d=&gt;{const r=d.data();if(r.date&amp;&amp;r.marketName)allRows.push({...r,id:d.id,openTime:r.openTime||markets.find(m=&gt;m.name===r.marketName)?.openTime||'00:00'});});
 statusEl.textContent=`${allRows.length} raw records loaded`;
 calculate();
}

function calculate(){
 const selected=marketSelect.value||'ALL_MERGED';
 const rows=sortRows(allRows.filter(r=&gt;selected==='ALL_MERGED'||r.marketName===selected).filter(r=&gt;jodiOf(r)!==null));
 const keys=Array.from({length:100},(_,i)=&gt;String(i).padStart(2,'0'));
 stats=Object.fromEntries(keys.map(k=&gt;[k,{occ:[],currentDelay:rows.length,maxDelay:rows.length,lastSeen:-1,count:0}]));
 rows.forEach((r,i)=&gt;{const j=jodiOf(r);stats[j].occ.push(i);stats[j].lastSeen=i;stats[j].count++;});
 keys.forEach(k=&gt;{const s=stats[k],o=s.occ,n=rows.length;s.currentDelay=o.length?n-1-o[o.length-1]:n;let gaps=o.length?[o[0]]:[n];for(let i=1;i&lt;o.length;i++)gaps.push(o[i]-o[i-1]-1);if(o.length)gaps.push(n-1-o[o.length-1]);s.maxDelay=Math.max(0,...gaps);});
 const arr=keys.map(j=&gt;({jodi:j,...stats[j]}));
 top10=arr.slice().sort((a,b)=&gt;b.currentDelay-a.currentDelay||b.maxDelay-a.maxDelay||a.jodi.localeCompare(b.jodi)).slice(0,10);
 recent10=arr.slice().sort((a,b)=&gt;a.currentDelay-b.currentDelay||b.lastSeen-a.lastSeen||a.jodi.localeCompare(b.jodi)).slice(0,10);
 renderGrid(arr,'ALL');
 statusEl.textContent=`${rows.length} completed Jodi games • TOP 10 = highest delay • RECENT 10 = lowest delay`;
}
function badgeSet(){return {top:new Set(top10.map(x=&gt;x.jodi)),recent:new Set(recent10.map(x=&gt;x.jodi))};}
function renderGrid(arr,mode){
 const bs=badgeSet();
 let list=arr;
 if(mode==='TOP')list=top10;
 if(mode==='RECENT')list=recent10;
 document.getElementById('filterLabel').textContent=mode;
 jodiGrid.innerHTML='';
 list.forEach(x=&gt;{
   const top=bs.top.has(x.jodi),recent=bs.recent.has(x.jodi);
   const el=document.createElement('button');
   el.className=`rounded-lg border p-2 text-center ${top?'border-orange-400 bg-orange-50':recent?'border-emerald-400 bg-emerald-50':'border-slate-200 bg-slate-50'} hover:shadow-sm`;
   el.innerHTML=`&lt;div class=&quot;text-sm font-black&quot;&gt;${x.jodi}&lt;/div&gt;&lt;div class=&quot;text-[9px] font-bold text-indigo-700&quot;&gt;D ${x.currentDelay}&lt;/div&gt;&lt;div class=&quot;text-[8px] font-bold text-slate-500&quot;&gt;M ${x.maxDelay}&lt;/div&gt;`;
   el.title=`Jodi ${x.jodi} • Delay ${x.currentDelay} • Max ${x.maxDelay}`;
   jodiGrid.appendChild(el);
 });
}
function analyzeDigitJodis(d){
 const items=Array.from({length:10},(_,c)=&gt;`${d}${c}`);
 const selected=marketSelect.value||'ALL_MERGED';
 const rows=sortRows(allRows.filter(r=&gt;(selected==='ALL_MERGED'||r.marketName===selected)).filter(r=&gt;jodiOf(r)!==null));
 const rank=items.map(j=&gt;({jodi:String(j),...stats[j]})).filter(Boolean).sort((a,b)=&gt;b.currentDelay-a.currentDelay||b.maxDelay-a.maxDelay||b.count-a.count||a.jodi.localeCompare(b.jodi));
 let top=rank.slice(0,3).map(x=&gt;String(x.jodi)),mid=rank.slice(3,7).map(x=&gt;String(x.jodi)),recent=rank.slice(7,10).map(x=&gt;String(x.jodi));
 let td=0,md=0,rd=0;
 const uniq=a=&gt;[...new Set(a.filter(Boolean))];
 const remove=(a,j)=&gt;a.filter(x=&gt;String(x)!==String(j));
 const firstOther=(a,exclude=[])=&gt;a.find(x=&gt;!exclude.includes(x));
 rows.forEach(r=&gt;{
   const hit=jodiOf(r);
   if(!items.includes(hit)){td++;md++;rd++;return;}
   const inTop=top.includes(hit),inMid=mid.includes(hit),inRecent=recent.includes(hit);
   if(inTop){
     const mMove=firstOther(mid,[hit]),rMove=firstOther(recent,[hit]);
     top=uniq([...remove(top,hit),mMove]).slice(0,3);
     mid=uniq([...remove(mid,mMove),rMove]).slice(0,4);
     recent=uniq([hit,...remove(recent,rMove)]).slice(0,3);
     td=0;md++;rd++;
   }else if(inMid){
     const rMove=firstOther(recent,[hit]);
     top=top.slice(0,3);
     mid=uniq([...remove(mid,hit),rMove]).slice(0,4);
     recent=uniq([hit,...remove(recent,rMove)]).slice(0,3);
     td++;md=0;rd++;
   }else if(inRecent){
     const rMove=firstOther(recent,[hit]),mMove=firstOther(mid,[hit]),tMove=firstOther(top,[mMove,hit]);
     top=uniq([...remove(top,tMove),mMove]).slice(0,3);
     mid=uniq([...remove(mid,mMove),rMove]).slice(0,4);
     recent=uniq([hit,...remove(recent,rMove),tMove]).slice(0,3);
     td++;md++;rd=0;
   }else{td++;md++;rd++;}
 });
 return {items,top,mid,recent,delay:{top:td,mid:md,recent:rd}};
}

function renderDigitPopup(group){
 const a=window.__digitPopupGroups;
 const jodiList = group==='TOP' ? a.top : group==='MID' ? a.mid : group==='RECENT' ? a.recent : a.items;
 const list = jodiList.map(j=&gt;{
   const s=stats[String(j)];
   return s ? {jodi:String(j), ...s} : null;
 }).filter(Boolean);
 const cls=group==='TOP'?'top':group==='MID'?'mid':group==='RECENT'?'recent':'';
 const body=document.getElementById('modalBody'); body.innerHTML='';
 if(group!=='ALL'){
   const h=document.createElement('div');
   h.className='rounded-xl border border-slate-200 bg-slate-50 p-2 mb-2 flex items-center justify-between';
   h.innerHTML=`&lt;div class=&quot;text-[10px] font-black&quot;&gt;${group} ${list.length} JODI&lt;/div&gt;&lt;div class=&quot;text-[10px] font-black text-indigo-700&quot;&gt;GROUP DELAY: ${a.delay[group.toLowerCase()]}&lt;/div&gt;`;
   body.appendChild(h);
 }
 list.forEach(x=&gt;{
   const row=document.createElement('div'); row.className=`modalJodiBlock ${cls}`;
   row.innerHTML=`&lt;div class=&quot;flex items-center justify-between gap-2&quot;&gt;&lt;div class=&quot;flex items-center gap-2&quot;&gt;&lt;span class=&quot;text-lg font-black&quot;&gt;${String(x.jodi).padStart(2,'0')}&lt;/span&gt;&lt;span class=&quot;text-[7px] font-black ${cls==='top'?'text-orange-700':cls==='mid'?'text-indigo-700':cls==='recent'?'text-emerald-700':'text-slate-500'}&quot;&gt;${group}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;text-right&quot;&gt;&lt;div class=&quot;text-[10px] font-black text-indigo-700&quot;&gt;DELAY: ${x.currentDelay}&lt;/div&gt;&lt;div class=&quot;text-[9px] font-bold text-slate-500&quot;&gt;MAX DELAY: ${x.maxDelay}&lt;/div&gt;&lt;div class=&quot;text-[8px] font-bold text-slate-400&quot;&gt;HITS: ${x.count}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`;
   body.appendChild(row);
 });
}
function showDigit(d){
 const a=analyzeDigitJodis(d); window.__digitPopupGroups=a;
 document.getElementById('modalTitle').textContent=`DIGIT ${d} • JODI FILTER`;
 document.getElementById('modalSub').textContent='10 Jodi • TOP 3 / MID 4 / RECENT 3 • Individual Delay + Max Delay';
 const box=document.getElementById('modalGroupBtns'); box.innerHTML='';
 [['TOP',a.top,'top'],['MID',a.mid,'mid'],['RECENT',a.recent,'recent']].forEach(([name,list,cls])=&gt;{

   b.innerHTML=`&lt;div class=&quot;text-[10px] font-black&quot;&gt;${name} ${list.length}&lt;/div&gt;&lt;div class=&quot;text-[9px] font-black mt-1&quot;&gt;DELAY: ${a.delay[name.toLowerCase()]}&lt;/div&gt;`;
   b.onclick=()=&gt;{box.querySelectorAll('button').forEach(x=&gt;x.classList.remove('active'));b.classList.add('active');renderDigitPopup(name)};
   box.appendChild(b);

 document.getElementById('modal').classList.remove('hidden');
}
function initDigits(){digitGrid.innerHTML='';for(let d=0;d&lt;=9;d++){const b=document.createElement('button');b.className='py-2 rounded-xl bg-indigo-600 text-white font-black text-sm shadow-sm';b.textContent=d;b.onclick=()=&gt;showDigit(d);digitGrid.appendChild(b);}}
marketSelect.addEventListener('change',calculate);document.getElementById('refreshBtn').onclick=load;document.getElementById('topBtn').onclick=()=&gt;renderGrid(top10,'TOP');document.getElementById('recentBtn').onclick=()=&gt;renderGrid(recent10,'RECENT');document.getElementById('closeModal').onclick=()=&gt;document.getElementById('modal').classList.add('hidden');document.getElementById('modal').addEventListener('click',e=&gt;{if(e.target.id==='modal')e.currentTarget.classList.add('hidden');});
initDigits();load().catch(e=&gt;{statusEl.textContent='ERROR: '+(e.message||e);console.error(e);});

function calculate(){

let metricMode='TOTAL'; const metricOf=r=&gt;{const o=digit(r.openAnk),c=digit(r.closeAnk);if(o===null||c===null)return null;return metricMode==='TOTAL'?((o+c)%10):((c-o+10)%10);};

function makeStats(history){const n=history.length,keys=Array.from({length:10},(_,i)=&gt;String(i)),a=Object.fromEntries(keys.map(k=&gt;[k,{jodi:k,occ:[],lastSeen:-1,count:0,currentDelay:n,maxDelay:0}]));history.forEach((r,i)=&gt;{const d=metricOf(r);if(d!==null){a[d].occ.push(i);a[d].lastSeen=i;a[d].count++;}});keys.forEach(k=&gt;{const x=a[k],o=x.occ;x.currentDelay=o.length?n-1-o[o.length-1]:n;let gaps=o.length?[o[0]]:[n];for(let i=1;i&lt;o.length;i++)gaps.push(o[i]-o[i-1]-1);if(o.length)gaps.push(n-1-o[o.length-1]);x.maxDelay=Math.max(0,...gaps);});return a;}
function calculate(){

function digitOf(v){
 if(v===undefined||v===null||v==="")return null;
 const s=String(v).trim();

   recent10:0,recent20:0,rate:0
