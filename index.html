<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Daily Activity Logger</title> 
    <script src="https://cdn.tailwindcss.com"></script> 
</head> 
<body class="bg-slate-100 p-4 min-h-screen flex flex-col items-center justify-between pb-20"> 

<div class="max-w-md w-full bg-white p-6 rounded-xl shadow-lg space-y-4 my-auto"> 
    <h2 id="pageTitle" class="text-xl font-bold text-center text-slate-800 tracking-wide">Daily Activity Logger</h2> 

    <!-- Alert Box --> 
    <div id="entryAlertBox" class="hidden bg-red-50 border border-red-200 p-3 rounded-lg text-sm text-red-700 font-semibold text-center w-full"> 
        ⚠️ <span id="alertMessageText">Entry for this session already exists! Switching to Update mode.</span> 
    </div> 

    <!-- LOGGER SECTION --> 
    <div id="loggerSection" class="space-y-4 w-full"> 
        <form id="matkaForm" class="space-y-4 w-full"> 
            <input type="hidden" id="recordId"> 

            <div class="w-full"> 
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Date</label> 
                <input type="date" id="recordDate" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white" required> 
            </div> 

            <div class="w-full"> 
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Market</label> 
                <div class="flex items-center gap-2 w-full"> 
                    <select id="marketDropdown" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white h-[42px]" required> 
                        <option value="">Select Market</option> 
                    </select> 
                    <button type="button" id="openModalBtn" class="bg-indigo-600 text-white px-3 h-[42px] rounded-lg hover:bg-indigo-700 shadow-sm transition flex items-center justify-center shrink-0" title="Manage Markets"> 
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg> 
                    </button> 
                </div> 
            </div> 

            <div class="w-full"> 
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Session</label> 
                <div class="flex items-center bg-slate-200 p-1 rounded-lg w-full"> 
                    <label class="flex-1 text-center cursor-pointer py-1.5 rounded-md transition-all text-sm font-semibold" id="openLabel"> 
                        <input type="radio" name="sessionToggle" value="Open" checked class="hidden"> Open 
                    </label> 
                    <label class="flex-1 text-center cursor-pointer py-1.5 rounded-md transition-all text-sm font-semibold" id="closeLabel"> 
                        <input type="radio" name="sessionToggle" value="Close" class="hidden"> Close 
                    </label> 
                </div> 
            </div> 

            <div class="w-full"> 
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">3-Digit Panna</label> 
                <input type="text" id="pannaInput" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="e.g. 126" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white" required> 
            </div> 

            <div class="bg-slate-50 border border-slate-200 p-3.5 rounded-lg text-sm text-slate-700 space-y-1.5 shadow-inner w-full"> 
                <div class="flex justify-between items-center"><span class="text-slate-500 text-xs font-medium uppercase">Ank:</span><span id="previewAnk" class="font-bold text-slate-900">-</span></div> 
                <div class="flex justify-between items-center"><span class="text-slate-500 text-xs font-medium uppercase">Group:</span><span id="previewGroup" class="font-bold text-slate-900">-</span></div> 
                <div class="flex justify-between items-center"><span class="text-slate-500 text-xs font-medium uppercase">Family Group:</span><span id="previewFamilyGroup" class="font-bold text-amber-700">-</span></div> 
                <div class="flex justify-between items-center"><span class="text-slate-500 text-xs font-medium uppercase">Type:</span><span id="previewPanelType" class="font-bold text-blue-600">-</span></div> 
            </div> 

            <div class="flex gap-2 pt-1 w-full"> 
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-2.5 rounded-lg hover:bg-blue-700 font-semibold text-sm shadow-sm transition">Save Record</button> 
                <button type="button" id="cancelEditBtn" class="hidden w-1/3 bg-red-600 text-white py-2.5 rounded-lg hover:bg-red-700 font-semibold text-sm transition">Cancel</button> 
            </div> 
        </form> 
    </div> 
</div> 

<!-- Bottom Navigation Bar --> 
<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-lg flex justify-around p-2 max-w-md mx-auto z-40 rounded-t-2xl"> 
    <a href="index.html" class="flex-1 flex flex-col items-center py-2 text-blue-600 font-bold transition"> 
        <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg> 
        <span class="text-xs">Logger</span> 
    </a> 
    <a href="analysis.html" class="flex-1 flex flex-col items-center py-2 text-slate-400 font-semibold transition"> 
        <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2m0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg> 
        <span class="text-xs">Analysis</span> 
    </a> 
</div> 

<!-- Custom Alert Modal --> 
<div id="customAlertModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center hidden p-4 z-50"> 
    <div class="bg-white p-6 rounded-2xl max-w-xs w-full space-y-4 shadow-2xl text-center"> 
        <div id="customAlertIcon" class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold">✓</div> 
        <div class="space-y-1"> 
            <h3 id="customAlertTitle" class="text-lg font-bold text-slate-800">Success</h3> 
            <p id="customAlertMessage" class="text-base font-medium text-slate-600 leading-relaxed">Operation completed successfully!</p> 
        </div> 
        <button type="button" id="customAlertOkBtn" class="w-full bg-emerald-600 text-white py-2.5 rounded-xl font-bold text-base hover:bg-emerald-700 shadow-md transition">OK</button> 
    </div> 
</div> 

<!-- Market Management Modal --> 
<div id="marketModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center hidden p-4 z-50"> 
    <div class="bg-white p-6 rounded-xl max-w-sm w-full space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto"> 
        <h3 class="text-lg font-bold text-slate-800 text-center">Market Management</h3> 
        <div class="flex bg-slate-200 p-1 rounded-lg"> 
            <label class="flex-1 text-center cursor-pointer py-1.5 rounded-md transition-all text-xs font-bold action-tab bg-emerald-600 text-white shadow-sm" id="tabAdd"><input type="radio" name="marketAction" value="add" checked class="hidden"> Add</label> 
            <label class="flex-1 text-center cursor-pointer py-1.5 rounded-md transition-all text-xs font-bold action-tab text-slate-700" id="tabEdit"><input type="radio" name="marketAction" value="edit" class="hidden"> Edit</label> 
            <label class="flex-1 text-center cursor-pointer py-1.5 rounded-md transition-all text-xs font-bold action-tab text-slate-700" id="tabDelete"><input type="radio" name="marketAction" value="delete" class="hidden"> Delete</label> 
        </div> 
        <div id="modalSelectMarketDiv" class="hidden space-y-1"> 
            <label class="block text-xs font-semibold text-slate-600 uppercase">Select Market</label> 
            <select id="modalMarketSelect" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none bg-white"><option value="">Select Market</option></select> 
        </div> 
        <div id="modalDetailsDiv" class="space-y-3"> 
            <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Market Name</label><input type="text" id="newMarketName" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none bg-white" placeholder="e.g. Kalyan"></div> 
            <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Open Time</label><input type="time" id="openTime" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none bg-white"></div> 
            <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Close Time</label><input type="time" id="closeTime" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none bg-white"></div> 
            <div> 
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-2">Working Days</label> 
                <div class="grid grid-cols-2 gap-2 text-xs text-slate-700"> 
                    <label class="flex items-center gap-1.5"><input type="checkbox" name="workingDay" value="Mon" checked class="rounded"> Monday</label> 
                    <label class="flex items-center gap-1.5"><input type="checkbox" name="workingDay" value="Tue" checked class="rounded"> Tuesday</label> 
                    <label class="flex items-center gap-1.5"><input type="checkbox" name="workingDay" value="Wed" checked class="rounded"> Wednesday</label> 
                    <label class="flex items-center gap-1.5"><input type="checkbox" name="workingDay" value="Thu" checked class="rounded"> Thursday</label> 
                    <label class="flex items-center gap-1.5"><input type="checkbox" name="workingDay" value="Fri" checked class="rounded"> Friday</label> 
                    <label class="flex items-center gap-1.5"><input type="checkbox" name="workingDay" value="Sat" checked class="rounded"> Saturday</label> 
                    <label class="flex items-center gap-1.5"><input type="checkbox" name="workingDay" value="Sun" checked class="rounded"> Sunday</label> 
                </div> 
            </div> 
        </div> 
        <div id="modalDeleteNotice" class="hidden text-xs text-red-600 font-semibold text-center p-2 bg-red-50 rounded-lg border border-red-200">⚠️ Warning: This action will permanently delete the selected market!</div> 
        <div class="flex gap-2 pt-2"> 
            <button type="button" id="executeMarketActionBtn" class="flex-1 bg-emerald-600 text-white py-2.5 rounded-lg font-semibold text-sm">Save Market</button> 
            <button type="button" id="closeModalBtn" class="flex-1 bg-red-600 text-white py-2.5 rounded-lg font-semibold text-sm">Cancel</button> 
        </div> 
    </div> 
</div> 

<script type="module"> 
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"; 
    import { getFirestore, collection, doc, getDoc, setDoc, deleteDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"; 

    const firebaseConfig = { 
        apiKey: "AIzaSyC7lVQlcPhEGv2V-UwlQ7d6Dq-eXb8boqQ", 
        authDomain: "m-record-f9c51.firebaseapp.com", 
        projectId: "m-record-f9c51", 
        storageBucket: "m-record-f9c51.firebasestorage.app", 
        messagingSenderId: "479303152172", 
        appId: "1:479303152172:web:3cc53dcecc9e8ce1ebd789" 
    }; 
    const app = initializeApp(firebaseConfig); 
    const db = getFirestore(app); 

    const dateInput = document.getElementById('recordDate'); 
    dateInput.value = new Date().toISOString().split('T')[0]; 
    let marketsList = []; 
    const modal = document.getElementById('marketModal'); 

    function showCustomAlert(title, message, type = 'success') { 
        const alertModal = document.getElementById('customAlertModal'); 
        document.getElementById('customAlertTitle').innerText = title; 
        document.getElementById('customAlertMessage').innerText = message; 
        const alertIcon = document.getElementById('customAlertIcon'); 
        const okBtn = document.getElementById('customAlertOkBtn'); 
        if (type === 'success') { 
            alertIcon.className = "w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold"; 
            alertIcon.innerHTML = "✓"; 
            okBtn.className = "w-full bg-emerald-600 text-white py-2.5 rounded-xl font-bold text-base hover:bg-emerald-700 shadow-md transition"; 
        } else { 
            alertIcon.className = "w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold"; 
            alertIcon.innerHTML = "✕"; 
            okBtn.className = "w-full bg-red-600 text-white py-2.5 rounded-xl font-bold text-base hover:bg-red-700 shadow-md transition"; 
        } 
        alertModal.classList.remove('hidden'); 
    } 
    document.getElementById('customAlertOkBtn').addEventListener('click', () => { 
        document.getElementById('customAlertModal').classList.add('hidden'); 
    }); 

    document.getElementById('openModalBtn').addEventListener('click', () => { 
        document.querySelector('input[name="marketAction"][value="add"]').checked = true; 
        updateActionTabUI(); 
        modal.classList.remove('hidden'); 
    }); 
    document.getElementById('closeModalBtn').addEventListener('click', () => modal.classList.add('hidden')); 

    const actionRadios = document.querySelectorAll('input[name="marketAction"]'); 
    function updateActionTabUI() { 
        let currentAction = document.querySelector('input[name="marketAction"]:checked').value; 
        document.querySelectorAll('.action-tab').forEach(tab => { 
            tab.className = "flex-1 text-center cursor-pointer py-1.5 rounded-md transition-all text-xs font-bold action-tab text-slate-700"; 
        }); 
        let activeTab = document.getElementById(`tab${currentAction.charAt(0).toUpperCase() + currentAction.slice(1)}`); 
        if(currentAction === 'delete') { 
            activeTab.className = "flex-1 text-center cursor-pointer py-1.5 rounded-md transition-all text-xs font-bold action-tab bg-red-600 text-white shadow-sm"; 
        } else { 
            activeTab.className = "flex-1 text-center cursor-pointer py-1.5 rounded-md transition-all text-xs font-bold action-tab bg-emerald-600 text-white shadow-sm"; 
        } 
        const selectDiv = document.getElementById('modalSelectMarketDiv'); 
        const detailsDiv = document.getElementById('modalDetailsDiv'); 
        const deleteNotice = document.getElementById('modalDeleteNotice'); 
        const actionBtn = document.getElementById('executeMarketActionBtn'); 
        populateModalDropdown(); 
        if (currentAction === 'add') { 
            selectDiv.classList.add('hidden'); detailsDiv.classList.remove('hidden'); deleteNotice.classList.add('hidden'); 
            actionBtn.innerText = "Save Market"; 
            actionBtn.className = "flex-1 bg-emerald-600 text-white py-2.5 rounded-lg font-semibold text-sm hover:bg-emerald-700 transition"; 
            document.getElementById('newMarketName').value = ''; 
            document.getElementById('openTime').value = ''; 
            document.getElementById('closeTime').value = ''; 
            document.querySelectorAll('input[name="workingDay"]').forEach(cb => cb.checked = true); 
        } else if (currentAction === 'edit') { 
            selectDiv.classList.remove('hidden'); detailsDiv.classList.remove('hidden'); deleteNotice.classList.add('hidden'); 
            actionBtn.innerText = "Update Market"; 
            actionBtn.className = "flex-1 bg-blue-600 text-white py-2.5 rounded-lg font-semibold text-sm hover:bg-blue-700 transition"; 
            loadSelectedMarketDataToModal(); 
        } else if (currentAction === 'delete') { 
            selectDiv.classList.remove('hidden'); detailsDiv.classList.add('hidden'); deleteNotice.classList.remove('hidden'); 
            actionBtn.innerText = "Delete Market"; 
            actionBtn.className = "flex-1 bg-red-600 text-white py-2.5 rounded-lg font-semibold text-sm hover:bg-red-700 transition"; 
        } 
    } 
    actionRadios.forEach(radio => radio.addEventListener('change', updateActionTabUI)); 

    function populateModalDropdown() { 
        const modalSelect = document.getElementById('modalMarketSelect'); 
        modalSelect.innerHTML = '<option value="">Select Market</option>'; 
        marketsList.forEach(m => { 
            let opt = document.createElement('option'); 
            opt.value = m.name; opt.textContent = m.name; 
            modalSelect.appendChild(opt); 
        }); 
    } 
    document.getElementById('modalMarketSelect').addEventListener('change', loadSelectedMarketDataToModal); 
    function loadSelectedMarketDataToModal() { 
        let currentAction = document.querySelector('input[name="marketAction"]:checked').value; 
        if (currentAction === 'add') return; 
        let selectedName = document.getElementById('modalMarketSelect').value; 
        let marketObj = marketsList.find(m => m.name === selectedName); 
        if (marketObj && currentAction === 'edit') { 
            document.getElementById('newMarketName').value = marketObj.name; 
            document.getElementById('openTime').value = marketObj.openTime || ''; 
            document.getElementById('closeTime').value = marketObj.closeTime || ''; 
            let days = marketObj.workingDays || []; 
            document.querySelectorAll('input[name="workingDay"]').forEach(cb => { cb.checked = days.includes(cb.value); }); 
        } 
    } 

    document.getElementById('executeMarketActionBtn').addEventListener('click', async () => { 
        let currentAction = document.querySelector('input[name="marketAction"]:checked').value; 
        if (currentAction === 'add') { 
            let name = document.getElementById('newMarketName').value.trim(); 
            let openTime = document.getElementById('openTime').value; 
            let closeTime = document.getElementById('closeTime').value; 
            let workingDays = []; 
            document.querySelectorAll('input[name="workingDay"]:checked').forEach(cb => workingDays.push(cb.value)); 
            if (!name) { showCustomAlert("Error", "Please enter market name!", "error"); return; } 
            if (marketsList.some(m => m.name.toLowerCase() === name.toLowerCase())) { 
                showCustomAlert("Error", "Duplicate market error: Market already exists!", "error"); return; 
            } 
            try { 
                const marketId = name.replace(/\s+/g, '_').toLowerCase(); 
                await setDoc(doc(db, "markets", marketId), { name, openTime, closeTime, workingDays, timestamp: serverTimestamp() }); 
                showCustomAlert("Success", "Market added successfully!"); 
                modal.classList.add('hidden'); loadMarkets(); 
            } catch (e) { showCustomAlert("Error", e.message, "error"); } 
        } else if (currentAction === 'edit') { 
            let selectedName = document.getElementById('modalMarketSelect').value; 
            let marketObj = marketsList.find(m => m.name === selectedName); 
            if (!marketObj) { showCustomAlert("Error", "Please select a market to edit!", "error"); return; } 
            let name = document.getElementById('newMarketName').value.trim(); 
            let openTime = document.getElementById('openTime').value; 
            let closeTime = document.getElementById('closeTime').value; 
            let workingDays = []; 
            document.querySelectorAll('input[name="workingDay"]:checked').forEach(cb => workingDays.push(cb.value)); 
            if (!name) { showCustomAlert("Error", "Please enter market name!", "error"); return; } 
            try { 
                await setDoc(doc(db, "markets", marketObj.id), { name, openTime, closeTime, workingDays }, { merge: true }); 
                showCustomAlert("Success", "Market updated successfully!"); 
                modal.classList.add('hidden'); loadMarkets(); 
            } catch (e) { showCustomAlert("Error", e.message, "error"); } 
        } else if (currentAction === 'delete') { 
            let selectedName = document.getElementById('modalMarketSelect').value; 
            let marketObj = marketsList.find(m => m.name === selectedName); 
            if (!marketObj) { showCustomAlert("Error", "Please select a market to delete!", "error"); return; } 
            if (confirm(`Are you sure you want to delete market "${selectedName}"?`)) { 
                try { 
                    await deleteDoc(doc(db, "markets", marketObj.id)); 
                    showCustomAlert("Success", "Market deleted successfully!"); 
                    modal.classList.add('hidden'); loadMarkets(); 
                } catch (e) { showCustomAlert("Error", e.message, "error"); } 
            } 
        } 
    }); 

    function selectDefaultMarketByTime() { 
        if (marketsList.length === 0) return; 
        const now = new Date(); 
        const currentTimeMinutes = now.getHours() * 60 + now.getMinutes(); 
        let selectedMarket = marketsList[0]; 
        let targetSession = "Open"; 
        for (let i = 0; i < marketsList.length; i++) { 
            let market = marketsList[i]; 
            if (!market.openTime || !market.closeTime) continue; 
            let [openH, openM] = market.openTime.split(':').map(Number); 
            let [closeH, closeM] = market.closeTime.split(':').map(Number); 
            let openMinutes = openH * 60 + openM; 
            let closeMinutes = closeH * 60 + closeM; 
            if (currentTimeMinutes >= openMinutes && currentTimeMinutes <= closeMinutes) { 
                selectedMarket = market; 
                let midpoint = openMinutes + Math.floor((closeMinutes - openMinutes) / 2); 
                targetSession = currentTimeMinutes <= midpoint ? "Open" : "Close"; 
                break; 
            } 
        } 
        const marketDropdown = document.getElementById('marketDropdown'); 
        if (selectedMarket && marketDropdown.value === "") { 
            marketDropdown.value = selectedMarket.name; 
            const sessionRadio = document.querySelector(`input[name="sessionToggle"][value="${targetSession}"]`); 
            if (sessionRadio) { sessionRadio.checked = true; updateToggleUI(); } 
            marketDropdown.dispatchEvent(new Event('change')); 
        } 
    } 

    async function loadMarkets() { 
        const marketDropdown = document.getElementById('marketDropdown'); 
        let currentSelected = marketDropdown.value; 
        try { 
            const querySnapshot = await getDocs(collection(db, "markets")); 
            marketDropdown.innerHTML = '<option value="">Select Market</option>'; 
            marketsList = []; 
            querySnapshot.forEach((docSnap) => { marketsList.push({ id: docSnap.id, ...docSnap.data() }); }); 
            marketsList.sort((a, b) => (a.openTime || "23:59").localeCompare(b.openTime || "23:59")); 
            marketsList.forEach(mData => { 
                let opt = document.createElement('option'); 
                opt.value = mData.name; opt.textContent = mData.name; 
                marketDropdown.appendChild(opt); 
            }); 
            if (currentSelected) marketDropdown.value = currentSelected; 
            else selectDefaultMarketByTime(); 
            checkValidationAndStatus(); 
        } catch (e) { console.log("Markets load error:", e); } 
    } 
    loadMarkets(); 

    const radioButtons = document.querySelectorAll('input[name="sessionToggle"]'); 
    const openLabel = document.getElementById('openLabel'); 
    const closeLabel = document.getElementById('closeLabel'); 
    function updateToggleUI() { 
        if(document.querySelector('input[name="sessionToggle"]:checked').value === 'Open') { 
            openLabel.className = "flex-1 text-center cursor-pointer py-1.5 rounded-md transition-all text-sm font-semibold bg-blue-600 text-white shadow-sm"; 
            closeLabel.className = "flex-1 text-center cursor-pointer py-1.5 rounded-md transition-all text-sm font-semibold text-slate-600"; 
        } else { 
            closeLabel.className = "flex-1 text-center cursor-pointer py-1.5 rounded-md transition-all text-sm font-semibold bg-blue-600 text-white shadow-sm"; 
            openLabel.className = "flex-1 text-center cursor-pointer py-1.5 rounded-md transition-all text-sm font-semibold text-slate-600"; 
        } 
    } 
    updateToggleUI(); 
    radioButtons.forEach(radio => radio.addEventListener('change', () => { updateToggleUI(); checkValidationAndStatus(); })); 

    document.getElementById('marketDropdown').addEventListener('change', checkValidationAndStatus); 
    document.getElementById('recordDate').addEventListener('change', checkValidationAndStatus); 

    async function checkValidationAndStatus() { 
        let marketName = document.getElementById('marketDropdown').value; 
        let dateStr = document.getElementById('recordDate').value; 
        let session = document.querySelector('input[name="sessionToggle"]:checked').value; 
        let alertBox = document.getElementById('entryAlertBox'); 
        let alertText = document.getElementById('alertMessageText'); 
        let submitBtn = document.getElementById('submitBtn'); 
        let pannaInput = document.getElementById('pannaInput'); 
        if (!marketName || !dateStr) return; 

        const d = new Date(dateStr); 
        const daysMap = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']; 
        let selectedMarketObj = marketsList.find(m => m.name === marketName); 
        if (selectedMarketObj && selectedMarketObj.workingDays) { 
            if (!selectedMarketObj.workingDays.includes(daysMap[d.getDay()])) { 
                alertBox.classList.remove('hidden'); 
                alertText.innerText = "Market is closed on this day (Non-working day)!"; 
                submitBtn.disabled = true; submitBtn.classList.add('opacity-50', 'cursor-not-allowed'); 
                pannaInput.disabled = true; pannaInput.value = ''; return; 
            } 
        } 
        submitBtn.disabled = false; submitBtn.classList.remove('opacity-50', 'cursor-not-allowed'); pannaInput.disabled = false; 

        try { 
            const docId = `${dateStr}_${marketName.replace(/\s+/g, '_')}`; 
            const docSnap = await getDoc(doc(db, "matka_records", docId)); 
            if (docSnap.exists()) { 
                let data = docSnap.data(); 
                let panaVal = session === 'Open' ? data.openPana : data.closePana; 
                if (panaVal) { 
                    alertBox.classList.remove('hidden'); 
                    alertText.innerText = `Entry available: Record for this ${session} session already exists! Switched to Update mode.`; 
                    document.getElementById('recordId').value = docId; 
                    submitBtn.innerText = "Update Record"; 
                    submitBtn.classList.replace('bg-blue-600', 'bg-emerald-600'); 
                    document.getElementById('cancelEditBtn').classList.remove('hidden'); 
                    pannaInput.value = panaVal; pannaInput.dispatchEvent(new Event('input')); 
                } else { 
                    alertBox.classList.add('hidden'); 
                    document.getElementById('recordId').value = docId; 
                    submitBtn.innerText = "Save Record"; 
                    submitBtn.classList.replace('bg-emerald-600', 'bg-blue-600'); 
                    document.getElementById('cancelEditBtn').classList.add('hidden'); 
                    pannaInput.value = ''; 
                } 
            } else { 
                alertBox.classList.add('hidden'); 
                document.getElementById('recordId').value = ''; 
                submitBtn.innerText = "Save Record"; 
                submitBtn.classList.replace('bg-emerald-600', 'bg-blue-600'); 
                document.getElementById('cancelEditBtn').classList.add('hidden'); 
                pannaInput.value = ''; 
            } 
        } catch (err) { console.log(err); } 
    } 

    let calculatedAnk = '', detectedPanelType = '', detectedFamilyGroup = ''; 
    function getFamilyGroup(panna) { 
        const familyPannaGroupsMap = { 
            "222": ["777", "222", "227", "277"], "444": ["444", "999", "499", "449"], "666": ["111", "666", "166", "116"], "888": ["888", "333", "338", "388"], "000": ["555", "000", "500", "550"], 
            "123": ["128", "123", "678", "178", "236", "367", "137", "268"], "345": ["345", "890", "390", "340", "480", "458", "589", "359"], "567": ["157", "567", "120", "260", "670", "170", "256", "125"], "789": ["789", "234", "248", "478", "239", "289", "347", "379"], "456": ["456", "145", "140", "190", "690", "460", "159", "569"], "470": ["470", "240", "290", "790", "245", "259", "579", "457"], "246": ["246", "269", "129", "124", "147", "179", "679", "467"], "369": ["346", "369", "148", "134", "139", "189", "689", "468"], "130": ["130", "180", "680", "360", "356", "568", "158", "135"], "230": ["230", "280", "780", "370", "258", "235", "357", "578"], "100": ["100", "600", "155", "556", "560", "150"], "200": ["200", "700", "255", "557", "570", "250"], "300": ["300", "800", "355", "558", "580", "350"], "400": ["400", "900", "455", "559", "590", "450"], "366": ["366", "668", "113", "118", "168", "136"], "330": ["335", "330", "588", "880", "380", "358"], "110": ["110", "115", "660", "566", "156", "160"], "440": ["445", "440", "599", "990", "490", "459"], "220": ["220", "225", "770", "577", "257", "270"], "334": ["339", "334", "889", "488", "348", "389"], "399": ["399", "899", "344", "448", "489", "349"], "377": ["778", "377", "228", "223", "237", "278"], "477": ["779", "477", "229", "224", "247", "279"], "144": ["446", "144", "699", "199", "149", "469"], "177": ["177", "677", "122", "226", "267", "127"], "114": ["119", "114", "669", "466", "146", "169"], "133": ["336", "133", "688", "188", "138", "368"], "233": ["337", "233", "788", "288", "238", "378"], "266": ["266", "667", "112", "117", "167", "126"], "244": ["447", "244", "799", "299", "249", "479"] 
        }; 
        for (let [groupKey, pannaList] of Object.entries(familyPannaGroupsMap)) { 
            if (pannaList.includes(panna)) return groupKey; 
        } 
        return panna.split('').sort().join(''); 
    } 

    document.getElementById('pannaInput').addEventListener('input', function(e) { 
        let panna = e.target.value; 
        if (panna.length === 3 && !isNaN(panna)) { 
            let sum = parseInt(panna[0]) + parseInt(panna[1]) + parseInt(panna[2]); 
            calculatedAnk = sum % 10; 
            if (panna[0] === panna[1] && panna[1] === panna[2]) detectedPanelType = "TP (Triple Panna)"; 
            else if (panna[0] === panna[1] || panna[1] === panna[2] || panna[0] === panna[2]) detectedPanelType = "DP (Double Panna)"; 
            else detectedPanelType = "SP (Single Panna)"; 
            detectedFamilyGroup = getFamilyGroup(panna); 
            document.getElementById('previewAnk').innerText = calculatedAnk; 
            document.getElementById('previewGroup').innerText = panna; 
            document.getElementById('previewFamilyGroup').innerText = detectedFamilyGroup; 
            document.getElementById('previewPanelType').innerText = detectedPanelType; 
        } else { 
            calculatedAnk = ''; detectedPanelType = ''; detectedFamilyGroup = ''; 
            document.getElementById('previewAnk').innerText = '-'; 
            document.getElementById('previewGroup').innerText = '-'; 
            document.getElementById('previewFamilyGroup').innerText = '-'; 
            document.getElementById('previewPanelType').innerText = '-'; 
        } 
    }); 

    document.getElementById('matkaForm').addEventListener('submit', async function(e) { 
        e.preventDefault(); 
        let session = document.querySelector('input[name="sessionToggle"]:checked').value; 
        let panna = document.getElementById('pannaInput').value; 
        let date = document.getElementById('recordDate').value; 
        let marketName = document.getElementById('marketDropdown').value; 
        if (!marketName) { showCustomAlert("Error", "Please select a market!", "error"); return; } 
        if (panna.length !== 3 || calculatedAnk === '') { showCustomAlert("Error", "Please enter a valid 3-digit panna!", "error"); return; } 

        const docRef = doc(db, "matka_records", `${date}_${marketName.replace(/\s+/g, '_')}`); 
        try { 
            let existingDoc = await getDoc(docRef); 
            let recordData = existingDoc.exists() ? existingDoc.data() : { date, marketName, timestamp: serverTimestamp() }; 
            if (session === "Open") { 
                recordData.openPana = panna; recordData.openAnk = calculatedAnk; recordData.openGroup = panna; recordData.openFamilyGroup = detectedFamilyGroup; recordData.openType = detectedPanelType; 
            } else { 
                recordData.closePana = panna; recordData.closeAnk = calculatedAnk; recordData.closeGroup = panna; recordData.closeFamilyGroup = detectedFamilyGroup; recordData.closeType = detectedPanelType; 
            } 
            await setDoc(docRef, recordData, { merge: true }); 
            showCustomAlert("Success", "Record saved successfully!"); 
            document.getElementById('matkaForm').reset(); 
            document.getElementById('recordDate').value = date; 
            document.getElementById('submitBtn').innerText = "Save Record"; 
            document.getElementById('submitBtn').classList.replace('bg-emerald-600', 'bg-blue-600'); 
            document.getElementById('cancelEditBtn').classList.add('hidden'); 
            document.getElementById('entryAlertBox').classList.add('hidden'); 
            document.querySelector(`input[name="sessionToggle"][value="${session === "Open" ? "Close" : "Open"}"]`).checked = true; 
            updateToggleUI(); 
            document.getElementById('previewAnk').innerText = '-'; document.getElementById('previewGroup').innerText = '-'; document.getElementById('previewFamilyGroup').innerText = '-'; document.getElementById('previewPanelType').innerText = '-'; 
        } catch (error) { showCustomAlert("Error", error.message, "error"); } 
    }); 
</script>
