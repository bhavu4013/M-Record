const groups = Object.keys(FAMILY_JODI_GROUPS);
let allRows = [], stats = {}, top5 = [], mid5 = [], recent5 = [], modalHistoryCount = 0;

function digit(v) {
  if (v === undefined || v === null || v === &quot;&quot;) return null;
  const n = parseInt(v, 10);
  return Number.isFinite(n) ? ((n % 10) + 10) % 10 : null;
}

function jodiOf(r) {
  const o = digit(r.openAnk ?? r.openDigit ?? r.open);
  const c = digit(r.closeAnk ?? r.closeDigit ?? r.close);
  return o === null || c === null ? null : String(o) + String(c);
}

function timeMin(s) {
  if (!s) return 1439;
  const m = String(s).match(/(\\d{1,2}):(\\d{2})/);
  return m ? parseInt(m[1],10) * 60 + parseInt(m[2],10) : 1439;
}

function dateValue(v) {
  if (v &amp;&amp; typeof v.toDate === &quot;function&quot;) {
    const d = v.toDate();
    return d instanceof Date &amp;&amp; !isNaN(d) ? d.getTime() : 0;
  }
  if (v &amp;&amp; typeof v.seconds === &quot;number&quot;) return v.seconds * 1000;
  const d = new Date(v);
  return d instanceof Date &amp;&amp; !isNaN(d) ? d.getTime() : 0;
}

function sortRows(rows) {
  return rows.slice().sort((a,b) =&gt;
    dateValue(a.date) - dateValue(b.date) ||
    timeMin(a.openTime) - timeMin(b.openTime)
  );
}

function setStatus(text, error=false) {

      opt.textContent = m.name;
      el.market.appendChild(opt);
    });

    el.market.value = [...el.market.options].some(o =&gt; o.value === previous)
      ? previous : &quot;ALL_MERGED&quot;;

    allRows = [];
    rSnap.forEach(d =&gt; {
      const r = d.data();
      if (r.date &amp;&amp; r.marketName) {
        allRows.push({
          ...r,
          id:d.id,
          openTime:r.openTime ||
            markets.find(m =&gt; m.name === r.marketName)?.openTime || &quot;00:00&quot;
        });
      }
    });

    calculate();
  } catch(e) {
    console.error(e);
    setStatus(&quot;ERROR: &quot; + (e?.message || String(e)), true);
    el.groupGrid.innerHTML =
      &#x27;&lt;div class=&quot;col-span-full text-center py-6 text-xs font-bold text-red-600&quot;&gt;&#x27; +
      &#x27;Firebase data load failed.&lt;br&gt;&lt;span class=&quot;text-[10px] text-slate-500&quot;&gt;&#x27; +
      &#x27;Check Firebase configuration / Firestore access.&lt;/span&gt;&lt;/div&gt;&#x27;;
  }
}

function calculate() {
  const selected = el.market.value || &quot;ALL_MERGED&quot;;

  // Only completed Jodi results are counted.
  // A completed game = Open + Close both available.
  const rows = sortRows(
    allRows
      .filter(r =&gt; selected === &quot;ALL_MERGED&quot; || r.marketName === selected)
      .filter(r =&gt; jodiOf(r) !== null)
  );

  const n = rows.length;
  modalHistoryCount = n;

  stats = Object.fromEntries(groups.map(g =&gt; [g, {
    occurrences: [],
    currentDelay: n,
    maxDelay: n,
    lastSeen: -1,
    count: 0
  }]));

  /*
    LOCKED FAMILY JODI DELAY RULE:

    If the Jodi of a completed game belongs to a Family-Jodi group,
    THAT GROUP is considered HIT for that game.

    Example:
      Group 12 contains 12,17,21,26,62,67,71,76.
      If today&#x27;s complete Jodi is 67,
      Group 12 HIT =&gt; Group 12 Delay = 0.

    The next completed game without any Group-12 Jodi:
      Delay = 1
    next:
      Delay = 2
    next:
      Delay = 3

    So delay is ALWAYS reset by the latest Jodi hit of that group.
  */

  // Build a direct Jodi -&gt; Family Group map.
  // Every Jodi belongs to exactly one locked Family Group.
  const jodiToGroup = {};
  groups.forEach(g =&gt; {
    FAMILY_JODI_GROUPS[g].forEach(j =&gt; {
      jodiToGroup[String(j).padStart(2, &quot;0&quot;)] = g;
    });
  });

  // Record EVERY hit of each Family Group.
  // A group is hit when ANY Jodi/member belonging to that group occurs.
  rows.forEach((r, i) =&gt; {
    const j = jodiOf(r);
    const group = jodiToGroup[j];

    if (group) {
      stats[group].occurrences.push(i);
      stats[group].lastSeen = i;
      stats[group].count++;
    }
  });

  groups.forEach(g =&gt; {
    const s = stats[g];
    const hits = s.occurrences;

    // EXACT GROUP DELAY COUNT:
    // Find the latest hit of ANY member Jodi in this Family Group.
    // Group delay = completed games since that latest group hit.
    s.currentDelay = hits.length
      ? n - 1 - hits[hits.length - 1]
      : n;

    // Keep Max Delay only as informational data.
    const gaps = hits.length ? [hits[0]] : [n];

    for (let i = 1; i &lt; hits.length; i++) {
      gaps.push(hits[i] - hits[i - 1] - 1);
    }

    if (hits.length) {
      gaps.push(n - 1 - hits[hits.length - 1]);
    }

    s.maxDelay = Math.max(0, ...gaps);
  });

  const arr = groups.map(g =&gt; ({ group: g, ...stats[g] }));

  // TOP/MID/RECENT are based ONLY on the 15 FAMILY GROUP names
  // and their GROUP DELAY COUNT.
  // Max Delay is NOT used for this classification.
  const delaySorted = arr.slice().sort((a, b) =&gt;
    b.currentDelay - a.currentDelay ||
    a.group.localeCompare(b.group)
  );

  top5 = delaySorted.slice(0, 5);
  mid5 = delaySorted.slice(5, 10);
  recent5 = delaySorted.slice(10, 15);

  // Category delay uses the latest hit of ANY member in the category,
  // exactly like the uploaded Open Digit Analysis page.
  function getGroupDelay(list) {
    const lastSeen = list.reduce(
      (mx, x) =&gt; Math.max(mx, Number.isFinite(x.lastSeen) ? x.lastSeen : -1),
      -1
    );
    return lastSeen &gt;= 0 ? Math.max(0, n - 1 - lastSeen) : n;
  }

  el.topDelaySummary.textContent =
    `DELAY: ${getGroupDelay(top5)}`;
  el.midDelaySummary.textContent =
    `DELAY: ${getGroupDelay(mid5)}`;
  el.recentDelaySummary.textContent =
    `DELAY: ${getGroupDelay(recent5)}`;

  renderGroups(arr, &quot;ALL&quot;);

  setStatus(
    `${n} completed Jodi games • Group hit = any member Jodi occurred`
  );
}

function badges() {
  return {
    top:new Set(top5.map(x=&gt;x.group)),
    mid:new Set(mid5.map(x=&gt;x.group)),
    recent:new Set(recent5.map(x=&gt;x.group))
  };
}

function renderGroups(arr, mode) {
  const b = badges();
  let list = arr;
  if (mode === &quot;TOP&quot;) list = top5;
  if (mode === &quot;MID&quot;) list = mid5;
  if (mode === &quot;RECENT&quot;) list = recent5;

  el.filterLabel.textContent = mode;
  el.groupGrid.innerHTML = &quot;&quot;;

  list.forEach(x =&gt; {
    const cls = b.top.has(x.group)
      ? &quot;border-orange-400 bg-orange-50&quot;
      : b.mid.has(x.group)
      ? &quot;border-indigo-400 bg-indigo-50&quot;
      : b.recent.has(x.group)
      ? &quot;border-emerald-400 bg-emerald-50&quot;
      : &quot;border-slate-200 bg-slate-50&quot;;

    const card = document.createElement(&quot;div&quot;);
    card.className = `rounded-lg border p-2 text-center ${cls}`;
    card.innerHTML = `
      &lt;div class=&quot;text-sm font-black&quot;&gt;${x.group}&lt;/div&gt;
      &lt;div class=&quot;text-[9px] font-bold text-indigo-700&quot;&gt;D ${x.currentDelay}&lt;/div&gt;
      &lt;div class=&quot;text-[8px] font-bold text-slate-500&quot;&gt;H ${x.count}&lt;/div&gt;`;
    el.groupGrid.appendChild(card);
  });
}

let modalDigitState={digit:null,groups:null,view:&#x27;ALL&#x27;};

function analyzeDigitJodis(d){
  // Same TOP/MID/RECENT movement + group-counter logic as Digit Analysis,
  // adapted from one Digit to the 10 Jodis belonging to that Digit.
  const digitKey=String(d);
  const items=Array.from({length:10},(_,c)=>digitKey+String(c));
  const selected=el.market.value||"ALL_MERGED";
  const rows=sortRows(allRows.filter(r=>(selected==="ALL_MERGED"||r.marketName===selected)).filter(r=>jodiOf(r)!==null));

  const makeStats=history=>{
    const n=history.length;
    const a=Object.fromEntries(items.map(j=>[j,{jodi:j,occ:[],lastSeen:-1,count:0,currentDelay:n,maxDelay:0}]));
    history.forEach((r,i)=>{const j=jodiOf(r);if(a[j]){a[j].occ.push(i);a[j].lastSeen=i;a[j].count++;}});
    items.forEach(j=>{
      const x=a[j],o=x.occ;
      x.currentDelay=o.length?n-1-o[o.length-1]:n;
      const gaps=o.length?[o[0]]:[n];
      for(let i=1;i<o.length;i++)gaps.push(o[i]-o[i-1]-1);
      if(o.length)gaps.push(n-1-o[o.length-1]);
      x.maxDelay=Math.max(0,...gaps);
    });
    return a;
  };

  const rank=history=>Object.values(makeStats(history)).sort((a,b)=>
    b.currentDelay-a.currentDelay||b.maxDelay-a.maxDelay||b.count-a.count||a.jodi.localeCompare(b.jodi)
  );
  const uniq=arr=>{const out=[];for(const x of arr){if(x&&!out.some(y=>y.jodi===x.jodi))out.push(x);}return out;};
  const most=(arr,exclude=[])=>arr.filter(x=>x&&!exclude.includes(x.jodi)).slice().sort((a,b)=>
    b.currentDelay-a.currentDelay||b.maxDelay-a.maxDelay||b.count-a.count||a.jodi.localeCompare(b.jodi)
  )[0]||null;

  const previous=rows.slice(0,-1);
  const ranked=rank(previous);
  let top=ranked.slice(0,3),mid=ranked.slice(3,7),recent=ranked.slice(7,10);

  const bucketDelay=list=>{
    const last=(list||[]).reduce((mx,x)=>Math.max(mx,Number.isFinite(x?.lastSeen)?x.lastSeen:-1),-1);
    return last>=0?Math.max(0,previous.length-1-last):previous.length;
  };
  let delay={top:bucketDelay(top),mid:bucketDelay(mid),recent:bucketDelay(recent)};

  const hit=rows.length?jodiOf(rows[rows.length-1]):null;
  const source=hit!==null&&items.includes(hit)
    ?(top.some(x=>x.jodi===hit)?"TOP":mid.some(x=>x.jodi===hit)?"MID":recent.some(x=>x.jodi===hit)?"RECENT":"NONE")
    :"NONE";

  // EXACT Digit Analysis movement rules.
  if(source==='TOP'){
    const hitObj=top.find(x=>x.jodi===hit);
    top=top.filter(x=>x.jodi!==hit);
    const rToMid=most(recent,[hit]);
    if(rToMid)recent=recent.filter(x=>x.jodi!==rToMid.jodi);
    if(rToMid)mid=uniq([...mid,rToMid]);
    const mToTop=most(mid,[hit]);
    if(mToTop)mid=mid.filter(x=>x.jodi!==mToTop.jodi);
    if(mToTop)top=uniq([...top,mToTop]);
    if(hitObj)recent=uniq([...recent,hitObj]);
  }else if(source==='MID'){
    const hitObj=mid.find(x=>x.jodi===hit);
    mid=mid.filter(x=>x.jodi!==hit);
    const rToMid=most(recent,[hit]);
    if(rToMid)recent=recent.filter(x=>x.jodi!==rToMid.jodi);
    if(rToMid)mid=uniq([...mid,rToMid]);
    if(hitObj)recent=uniq([...recent,hitObj]);
  }else if(source==='RECENT'){
    recent=uniq(recent);
  }

  const used=new Set([...top,...mid,...recent].map(x=>x.jodi));
  const fill=(bucket,size)=>{for(const x of ranked){if(bucket.length>=size)break;if(!used.has(x.jodi)){bucket.push(x);used.add(x.jodi);}}return bucket;};
  top=fill(uniq(top),3);mid=fill(uniq(mid),4);recent=fill(uniq(recent),3);

  // Group counters are independent from individual Jodi delay.
  delay=source==='TOP'
    ?{top:0,mid:delay.mid+1,recent:delay.recent+1}
    :source==='MID'
    ?{top:delay.top+1,mid:0,recent:delay.recent+1}
    :source==='RECENT'
    ?{top:delay.top+1,mid:delay.mid+1,recent:0}
    :{top:delay.top+1,mid:delay.mid+1,recent:delay.recent+1};

  const currentStats=makeStats(rows);
  return {digit:d,items,all:items.map(j=>currentStats[j]),stats:currentStats,top,mid,recent,delay,historyCount:rows.length};
}

&lt;script type=&quot;module&quot;&gt;
import { initializeApp } from &quot;https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js&quot;;
import { getFirestore, collection, getDocs } from &quot;https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js&quot;;

const firebaseConfig={
 apiKey:&quot;AIzaSyC7lVQlcPhEGv2V-UwlQ7d6Dq-eXb8boqQ&quot;,

};
const db=getFirestore(initializeApp(firebaseConfig));
const marketSelect=document.getElementById(&#x27;marketSelect&#x27;),jodiGrid=document.getElementById(&#x27;jodiGrid&#x27;),digitGrid=document.getElementById(&#x27;digitGrid&#x27;),statusEl=document.getElementById(&#x27;status&#x27;);
let allRows=[], stats={}, top10=[], recent10=[];

const digit=v=&gt;{ if(v===undefined||v===null||v===&#x27;&#x27;) return null; const n=parseInt(v,10); return Number.isFinite(n)?((n%10)+10)%10:null; };

const timeMin=s=&gt;{if(!s)return 1439;const m=String(s).match(/(\d{1,2}):(\d{2})/);return m?parseInt(m[1])*60+parseInt(m[2]):1439;};
function sortRows(rows){return rows.slice().sort((a,b)=&gt;new Date(a.date)-new Date(b.date)||timeMin(a.openTime)-timeMin(b.openTime));}

async function load(){
 statusEl.textContent=&#x27;Loading Firebase data...&#x27;;
 const [mSnap,rSnap]=await Promise.all([getDocs(collection(db,&#x27;markets&#x27;)),getDocs(collection(db,&#x27;matka_records&#x27;))]);
 marketSelect.innerHTML=&#x27;&lt;option value=&quot;ALL_MERGED&quot;&gt;ALL MARKETS (MERGED)&lt;/option&gt;&#x27;;
 const markets=[];mSnap.forEach(d=&gt;markets.push({id:d.id,...d.data()}));
 markets.sort((a,b)=&gt;timeMin(a.openTime)-timeMin(b.openTime));
 markets.forEach(m=&gt;{const o=document.createElement(&#x27;option&#x27;);o.value=m.name;o.textContent=m.name;marketSelect.appendChild(o);});
 allRows=[];rSnap.forEach(d=&gt;{const r=d.data();if(r.date&amp;&amp;r.marketName)allRows.push({...r,id:d.id,openTime:r.openTime||markets.find(m=&gt;m.name===r.marketName)?.openTime||&#x27;00:00&#x27;});});

function calculate(){
 const selected=marketSelect.value||&#x27;ALL_MERGED&#x27;;
 const rows=sortRows(allRows.filter(r=&gt;selected===&#x27;ALL_MERGED&#x27;||r.marketName===selected).filter(r=&gt;jodiOf(r)!==null));
 const keys=Array.from({length:100},(_,i)=&gt;String(i).padStart(2,&#x27;0&#x27;));
 stats=Object.fromEntries(keys.map(k=&gt;[k,{occ:[],currentDelay:rows.length,maxDelay:rows.length,lastSeen:-1,count:0}]));
 rows.forEach((r,i)=&gt;{const j=jodiOf(r);stats[j].occ.push(i);stats[j].lastSeen=i;stats[j].count++;});
 keys.forEach(k=&gt;{const s=stats[k],o=s.occ,n=rows.length;s.currentDelay=o.length?n-1-o[o.length-1]:n;let gaps=o.length?[o[0]]:[n];for(let i=1;i&lt;o.length;i++)gaps.push(o[i]-o[i-1]-1);if(o.length)gaps.push(n-1-o[o.length-1]);s.maxDelay=Math.max(0,...gaps);});

 top10=arr.slice().sort((a,b)=&gt;b.currentDelay-a.currentDelay||b.maxDelay-a.maxDelay||a.jodi.localeCompare(b.jodi)).slice(0,10);
 recent10=arr.slice().sort((a,b)=&gt;a.currentDelay-b.currentDelay||b.lastSeen-a.lastSeen||a.jodi.localeCompare(b.jodi)).slice(0,10);
 renderGrid(arr,&#x27;ALL&#x27;);
 statusEl.textContent=`${rows.length} completed Jodi games • TOP 10 = highest delay • RECENT 10 = lowest delay`;
}
function badgeSet(){return {top:new Set(top10.map(x=&gt;x.jodi)),recent:new Set(recent10.map(x=&gt;x.jodi))};}
function renderGrid(arr,mode){
 const bs=badgeSet();
 let list=arr;
 if(mode===&#x27;TOP&#x27;)list=top10;
 if(mode===&#x27;RECENT&#x27;)list=recent10;
 document.getElementById(&#x27;filterLabel&#x27;).textContent=mode;
 jodiGrid.innerHTML=&#x27;&#x27;;
 list.forEach(x=&gt;{
   const top=bs.top.has(x.jodi),recent=bs.recent.has(x.jodi);
   const el=document.createElement(&#x27;button&#x27;);
   el.className=`rounded-lg border p-2 text-center ${top?&#x27;border-orange-400 bg-orange-50&#x27;:recent?&#x27;border-emerald-400 bg-emerald-50&#x27;:&#x27;border-slate-200 bg-slate-50&#x27;} hover:shadow-sm`;
   el.innerHTML=`&lt;div class=&quot;text-sm font-black&quot;&gt;${x.jodi}&lt;/div&gt;&lt;div class=&quot;text-[9px] font-bold text-indigo-700&quot;&gt;D ${x.currentDelay}&lt;/div&gt;&lt;div class=&quot;text-[8px] font-bold text-slate-500&quot;&gt;M ${x.maxDelay}&lt;/div&gt;`;
   el.title=`Jodi ${x.jodi} • Delay ${x.currentDelay} • Max ${x.maxDelay}`;
   jodiGrid.appendChild(el);
 });
}
function analyzeDigitJodis(d){
 const digitKey=String(d);
 const items=Array.from({length:10},(_,c)=>digitKey+String(c));
 const selected=marketSelect.value||'ALL_MERGED';
 const rows=sortRows(allRows.filter(r=>(selected==='ALL_MERGED'||r.marketName===selected)).filter(r=>jodiOf(r)!==null));

 // For a clicked digit, calculate individual Jodi delay only within
 // the selected digit's 10-Jodi event sequence.
 const events=rows.map(r=>jodiOf(r)).filter(j=>items.includes(j));
 const localStats=Object.fromEntries(items.map(j=>[j,{jodi:j,occ:[],currentDelay:events.length,maxDelay:events.length,lastSeen:-1,count:0}]));
 events.forEach((j,i)=>{
   const s=localStats[j];
   s.occ.push(i);s.lastSeen=i;s.count++;
 });
 items.forEach(j=>{
   const s=localStats[j],o=s.occ,n=events.length;
   s.currentDelay=o.length?n-1-o[o.length-1]:n;
   let gaps=o.length?[o[0]]:[n];
   for(let i=1;i<o.length;i++)gaps.push(o[i]-o[i-1]-1);
   if(o.length)gaps.push(n-1-o[o.length-1]);
   s.maxDelay=Math.max(0,...gaps);
 });

 const rank=items.map(j=>localStats[j]).sort((a,b)=>
   b.currentDelay-a.currentDelay||b.maxDelay-a.maxDelay||b.count-a.count||a.jodi.localeCompare(b.jodi)
 );
 let top=rank.slice(0,3).map(x=>x.jodi),mid=rank.slice(3,7).map(x=>x.jodi),recent=rank.slice(7,10).map(x=>x.jodi);
 let td=0,md=0,rd=0;

 // Same group-counter logic as Digit Analysis, replayed only on
 // the selected digit's 10-Jodi sequence.
 events.forEach(hit=>{
   const inTop=top.includes(hit),inMid=mid.includes(hit),inRecent=recent.includes(hit);
   if(inTop){td=0;md++;rd++;}
   else if(inMid){td++;md=0;rd++;}
   else if(inRecent){td++;md++;rd=0;}
   else{td++;md++;rd++;}
 });

}

 wrap.innerHTML=`&lt;div class=&quot;flex justify-between items-center mb-2&quot;&gt;&lt;div class=&quot;font-black text-sm&quot;&gt;10 JODI&lt;/div&gt;&lt;div class=&quot;text-[9px] font-black text-indigo-600&quot;&gt;${group===&#x27;ALL&#x27;?&#x27;ALL 10&#x27;:group+&#x27; &#x27;+list.length}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;text-[9px] font-bold text-slate-500 mb-2&quot;&gt;TOP: ${topText} | MID: ${midText} | RECENT: ${recentText}&lt;/div&gt;&lt;div id=&quot;modalJodiGrid&quot; class=&quot;grid grid-cols-5 gap-2&quot;&gt;&lt;/div&gt;`;

   card.innerHTML=`&lt;div class=&quot;text-sm font-black&quot;&gt;${x.jodi}&lt;/div&gt;&lt;div class=&quot;text-[9px] font-bold text-indigo-700&quot;&gt;D ${x.currentDelay}&lt;/div&gt;&lt;div class=&quot;text-[8px] font-bold text-slate-500&quot;&gt;M ${x.maxDelay}&lt;/div&gt;&lt;div class=&quot;text-[7px] font-bold text-slate-400&quot;&gt;H ${x.count}&lt;/div&gt;`;

}
async function load(){

<script>

const morePanel=document.getElementById('morePanel');
const morePages=[0,1,2,3,4,5,6];
function openPage(index){
 buttons.forEach(b=>b.classList.toggle('active',Number(b.dataset.page)===index));
 if(moreNav)moreNav.classList.toggle('active',morePages.includes(index));
 if(morePanel)morePanel.classList.remove('show');

 try{localStorage.setItem('analysisPlatformPageV8',String(index));}catch(e){}
 if(index===11){
  const dp=document.getElementById('page-8');
  if(dp && dp.contentWindow)dp.contentWindow.postMessage({type:'REQUEST_DIGIT_PLAY_SIGNAL'},'*');
 }
}
buttons.forEach(b=>b.addEventListener('click',()=>openPage(Number(b.dataset.page))));
if(moreNav){moreNav.addEventListener('click',(e)=>{e.stopPropagation();morePanel.classList.toggle('show');});}
document.addEventListener('click',(e)=>{if(morePanel && !morePanel.contains(e.target) && e.target!==moreNav)morePanel.classList.remove('show');});

 if(!e.data || e.data.type!=="DIGIT_PLAY_SIGNAL")return;
 const target=document.getElementById("page-11");
 if(target && target.contentWindow)target.contentWindow.postMessage(e.data,"*");
});
