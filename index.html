<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matka Record Entry Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md space-y-4">
        <h2 class="text-xl font-bold text-center text-gray-800">મટકા રેકોર્ડ એન્ટ્રી ફોર્મ</h2>

        <!-- છેલ્લી એન્ટ્રી પ્રદર્શિત કરવા માટેનું સેક્શન -->
        <div id="lastEntryBox" class="bg-yellow-50 border border-yellow-200 p-3 rounded-md text-sm text-yellow-800">
            <p class="font-bold">છેલ્લી એન્ટ્રી (Last Entry):</p>
            <p id="lastEntryDetails">લોડ થઈ રહ્યું છે...</p>
        </div>

        <form id="matkaForm" class="space-y-4">
            <input type="hidden" id="recordId">

            <!-- તારીખ -->
            <div>
                <label class="block text-sm font-medium text-gray-700">તારીખ (Date)</label>
                <input type="date" id="recordDate" class="mt-1 block w-full border border-gray-300 rounded-md p-2" required>
            </div>

            <!-- માર્કેટ સિલેક્ટ ડ્રોપડાઉન અને 'Add Market' બટન -->
            <div>
                <label class="block text-sm font-medium text-gray-700">માર્કેટ (Market)</label>
                <div class="flex gap-2 mt-1">
                    <select id="marketDropdown" class="flex-1 border border-gray-300 rounded-md p-2" required>
                        <option value="">માર્કેટ પસંદ કરો</option>
                    </select>
                    <button type="button" id="openModalBtn" class="bg-green-600 text-white px-3 py-2 rounded-md hover:bg-green-700 text-sm font-semibold">+ Add Market</button>
                </div>
            </div>

            <!-- સેશન માટે ટોગલ સ્વીચ -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">સેશન (Session)</label>
                <div class="flex items-center bg-gray-200 p-1 rounded-md">
                    <label class="flex-1 text-center cursor-pointer py-1 rounded-md transition-all font-semibold" id="openLabel">
                        <input type="radio" name="sessionToggle" value="Open" checked class="hidden"> Open
                    </label>
                    <label class="flex-1 text-center cursor-pointer py-1 rounded-md transition-all font-semibold" id="closeLabel">
                        <input type="radio" name="sessionToggle" value="Close" class="hidden"> Close
                    </label>
                </div>
            </div>

            <!-- ૩ ડિજિટનો પન્નો -->
            <div>
                <label class="block text-sm font-medium text-gray-700">પન્ના (3-Digit Panna)</label>
                <input type="text" id="pannaInput" maxlength="3" placeholder="દા.ત. 126" class="mt-1 block w-full border border-gray-300 rounded-md p-2" required>
            </div>

            <!-- પ્રીવ્યુ -->
            <div class="bg-gray-50 p-3 rounded-md text-sm text-gray-600 space-y-1">
                <p>ઓટો સિંગલ અંક: <span id="previewAnk" class="font-bold text-black">-</span></p>
                <p>પેનલ ગ્રુપ / પટ્ટી: <span id="previewGroup" class="font-bold text-black">-</span></p>
                <p>પેનલ ટાઈપ: <span id="previewPanelType" class="font-bold text-blue-600">-</span></p>
            </div>

            <!-- સબમિટ અને અપડેટ બટન -->
            <div class="flex gap-2">
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white p-2 rounded-md hover:bg-blue-700 font-semibold">ડેટા સેવ કરો</button>
                <button type="button" id="cancelEditBtn" class="hidden w-1/3 bg-gray-400 text-white p-2 rounded-md hover:bg-gray-500 font-semibold">રદ કરો</button>
            </div>
        </form>
    </div>

    <!-- Add Market Modal (પોપઅપ વિન્ડો) -->
    <div id="marketModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden p-4">
        <div class="bg-white p-6 rounded-lg max-w-sm w-full space-y-3 max-h-[90vh] overflow-y-auto">
            <h3 class="text-lg font-bold text-gray-800">નવી માર્કેટ ઉમેરો</h3>
            
            <div>
                <label class="block text-sm font-medium text-gray-700">માર્કેટનું નામ</label>
                <input type="text" id="newMarketName" class="mt-1 block w-full border border-gray-300 rounded-md p-2" placeholder="દા.ત. Kalyan">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">ઓપન ટાઈમ (Open Time)</label>
                <input type="time" id="openTime" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">ઓપન રિઝલ્ટ ટાઈમ (Open Result Time)</label>
                <input type="time" id="openResultTime" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">ક્લોઝ ટાઈમ (Close Time)</label>
                <input type="time" id="closeTime" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">ક્લોઝ રિઝલ્ટ ટાઈમ (Close Result Time)</label>
                <input type="time" id="closeResultTime" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">રિઝલ્ટ ટાઈમ (Final Result Time)</label>
                <input type="time" id="resultTime" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
            </div>

            <div class="flex gap-2 pt-2">
                <button type="button" id="saveMarketBtn" class="flex-1 bg-green-600 text-white py-2 rounded-md font-semibold hover:bg-green-700">સેવ કરો</button>
                <button type="button" id="closeModalBtn" class="flex-1 bg-gray-400 text-white py-2 rounded-md font-semibold hover:bg-gray-500">બંધ કરો</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, doc, getDocs, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyC7lVQlcPhEGv2V-UwlQ7d6Dq-eXb8boqQ",
          authDomain: "m-record-f9c51.firebaseapp.com",
          projectId: "m-record-f9c51",
          storageBucket: "m-record-f9c51.firebasestorage.app",
          messagingSenderId: "479303152172",
          appId: "1:479303152172:web:3cc53dcecc9e8ce1ebd789"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const dateInput = document.getElementById('recordDate');
        dateInput.value = new Date().toISOString().split('T')[0];

        // માર્કેટ પોપઅપ મોડલ કંટ્રોલ
        const modal = document.getElementById('marketModal');
        document.getElementById('openModalBtn').addEventListener('click', () => modal.classList.remove('hidden'));
        document.getElementById('closeModalBtn').addEventListener('click', () => modal.classList.add('hidden'));

        // ફાયરબેઝમાંથી માર્કેટ લિસ્ટ લોડ કરવા
        async function loadMarkets() {
            const marketDropdown = document.getElementById('marketDropdown');
            try {
                const querySnapshot = await getDocs(collection(db, "markets"));
                marketDropdown.innerHTML = '<option value="">માર્કેટ પસંદ કરો</option>';
                querySnapshot.forEach((docSnap) => {
                    let mData = docSnap.data();
                    let opt = document.createElement('option');
                    opt.value = mData.name;
                    opt.textContent = `${mData.name} (Open: ${mData.openTime || '-'}, Close: ${mData.closeTime || '-'})`;
                    marketDropdown.appendChild(opt);
                });
            } catch (e) {
                console.log("Markets load error:", e);
            }
        }
        loadMarkets();

        // નવી માર્કેટ સેવ કરવાનું લોજિક
        document.getElementById('saveMarketBtn').addEventListener('click', async () => {
            let name = document.getElementById('newMarketName').value.trim();
            let openTime = document.getElementById('openTime').value;
            let openResultTime = document.getElementById('openResultTime').value;
            let closeTime = document.getElementById('closeTime').value;
            let closeResultTime = document.getElementById('closeResultTime').value;
            let resultTime = document.getElementById('resultTime').value;

            if(!name) {
                alert("કૃપા કરીને માર્કેટનું નામ લખો!");
                return;
            }

            try {
                await addDoc(collection(db, "markets"), {
                    name: name,
                    openTime: openTime,
                    openResultTime: openResultTime,
                    closeTime: closeTime,
                    closeResultTime: closeResultTime,
                    resultTime: resultTime,
                    timestamp: serverTimestamp()
                });
                alert("માર્કેટ સફળતાપૂર્વક ઉમેરાઈ ગઈ છે!");
                modal.classList.add('hidden');
                
                document.getElementById('newMarketName').value = '';
                document.getElementById('openTime').value = '';
                document.getElementById('openResultTime').value = '';
                document.getElementById('closeTime').value = '';
                document.getElementById('closeResultTime').value = '';
                document.getElementById('resultTime').value = '';
                
                loadMarkets();
            } catch (error) {
                alert("ભૂલ આવી છે: " + error.message);
            }
        });

        // ટોગલ સ્વીચ યુઆઈ મેનેજમેન્ટ
        const radioButtons = document.querySelectorAll('input[name="sessionToggle"]');
        const openLabel = document.getElementById('openLabel');
        const closeLabel = document.getElementById('closeLabel');

        function updateToggleUI() {
            if(document.querySelector('input[name="sessionToggle"]:checked').value === 'Open') {
                openLabel.className = "flex-1 text-center cursor-pointer py-1 rounded-md transition-all font-semibold bg-blue-600 text-white";
                closeLabel.className = "flex-1 text-center cursor-pointer py-1 rounded-md transition-all font-semibold text-gray-700";
            } else {
                closeLabel.className = "flex-1 text-center cursor-pointer py-1 rounded-md transition-all font-semibold bg-blue-600 text-white";
                openLabel.className = "flex-1 text-center cursor-pointer py-1 rounded-md transition-all font-semibold text-gray-700";
            }
        }
        updateToggleUI();

        radioButtons.forEach(radio => {
            radio.addEventListener('change', updateToggleUI);
        });

        // છેલ્લી એન્ટ્રી ફેચ કરવાનું ફંક્શન
        async function fetchLastEntry() {
            try {
                const q = query(collection(db, "matka_records"), orderBy("timestamp", "desc"), limit(1));
                const querySnapshot = await getDocs(q);
                
                const detailsBox = document.getElementById('lastEntryDetails');
                if (!querySnapshot.empty) {
                    querySnapshot.forEach((docSnap) => {
                        let data = docSnap.data();
                        let sessionVal = data.session || (data.openPana ? 'Open' : 'Close');
                        let pannaVal = sessionVal === 'Open' ? data.openPana : data.closePana;
                        let ankVal = sessionVal === 'Open' ? data.openAnk : data.closeAnk;
                        
                        detailsBox.innerHTML = `
                            તારીખ: ${data.date} | માર્કેટ: ${data.marketName} | સેશન: ${sessionVal} | પન્નો: ${pannaVal} (અંક: ${ankVal})
                            <br><button id="editLastBtn" data-id="${docSnap.id}" class="mt-2 bg-yellow-600 text-white px-2 py-1 rounded text-xs hover:bg-yellow-700">આ એન્ટ્રી સુધારો (Edit)</button>
                        `;

                        document.getElementById('editLastBtn').addEventListener('click', function() {
                            let id = this.getAttribute('data-id');
                            loadDataForEdit(id, data);
                        });
                    });
                } else {
                    detailsBox.innerText = "કોઈ જૂની એન્ટ્રી મળી નથી.";
                }
            } catch (error) {
                console.error("Error fetching last entry: ", error);
            }
        }

        fetchLastEntry();

        function loadDataForEdit(id, data) {
            document.getElementById('recordId').value = id;
            document.getElementById('recordDate').value = data.date;
            document.getElementById('marketDropdown').value = data.marketName;
            
            let sessionVal = data.session || (data.openPana ? 'Open' : 'Close');
            document.querySelector(`input[name="sessionToggle"][value="${sessionVal}"]`).checked = true;
            updateToggleUI();
            
            let panna = sessionVal === 'Open' ? data.openPana : data.closePana;
            document.getElementById('pannaInput').value = panna;
            document.getElementById('pannaInput').dispatchEvent(new Event('input'));

            document.getElementById('submitBtn').innerText = "ડેટા અપડેટ કરો";
            document.getElementById('submitBtn').classList.replace('bg-blue-600', 'bg-green-600');
            document.getElementById('cancelEditBtn').classList.remove('hidden');
        }

        document.getElementById('cancelEditBtn').addEventListener('click', function() {
            document.getElementById('matkaForm').reset();
            document.getElementById('recordId').value = '';
            document.getElementById('submitBtn').innerText = "ડેટા સેવ કરો";
            document.getElementById('submitBtn').classList.replace('bg-green-600', 'bg-blue-600');
            this.classList.add('hidden');
            dateInput.value = new Date().toISOString().split('T')[0];
            document.querySelector('input[name="sessionToggle"][value="Open"]').checked = true;
            updateToggleUI();
            document.getElementById('previewAnk').innerText = '-';
            document.getElementById('previewGroup').innerText = '-';
            document.getElementById('previewPanelType').innerText = '-';
        });

        let calculatedAnk = '';
        let detectedPanelType = '';

        document.getElementById('pannaInput').addEventListener('input', function(e) {
            let panna = e.target.value;
            if (panna.length === 3 && !isNaN(panna)) {
                let sum = parseInt(panna[0]) + parseInt(panna[1]) + parseInt(panna[2]);
                calculatedAnk = sum % 10; 
                
                if (panna[0] === panna[1] && panna[1] === panna[2]) {
                    detectedPanelType = "TP (Triple Panna)";
                } else if (panna[0] === panna[1] || panna[1] === panna[2] || panna[0] === panna[2]) {
                    detectedPanelType = "DP (Double Panna)";
                } else {
                    detectedPanelType = "SP (Single Panna)";
                }

                document.getElementById('previewAnk').innerText = calculatedAnk;
                document.getElementById('previewGroup').innerText = panna; 
                document.getElementById('previewPanelType').innerText = detectedPanelType;
            } else {
                calculatedAnk = '';
                detectedPanelType = '';
                document.getElementById('previewAnk').innerText = '-';
                document.getElementById('previewGroup').innerText = '-';
                document.getElementById('previewPanelType').innerText = '-';
            }
        });

        document.getElementById('matkaForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            let recordId = document.getElementById('recordId').value;
            let session = document.querySelector('input[name="sessionToggle"]:checked').value;
            let panna = document.getElementById('pannaInput').value;
            let date = document.getElementById('recordDate').value;
            let marketName = document.getElementById('marketDropdown').value;

            if (!marketName) {
                alert("કૃપા કરીને માર્કેટ પસંદ કરો!");
                return;
            }

            if (panna.length !== 3 || calculatedAnk === '') {
                alert("કૃપા કરીને ૩ ડિજિટનો સાચો પન્નો નાખો!");
                return;
            }

            let recordData = {
                date: date,
                marketName: marketName,
                session: session,
                timestamp: serverTimestamp()
            };

            if (session === "Open") {
                recordData.openPana = panna;
                recordData.openAnk = calculatedAnk;
                recordData.openGroup = panna; 
                recordData.openType = detectedPanelType;
            } else {
                recordData.closePana = panna;
                recordData.closeAnk = calculatedAnk;
                recordData.closeGroup = panna; 
                recordData.closeType = detectedPanelType;
            }

            try {
                if (recordId) {
                    await updateDoc(doc(db, "matka_records", recordId), recordData);
                    alert("ડેટા સફળતાપૂર્વક અપડેટ થઈ ગયો છે!");
                } else {
                    await addDoc(collection(db, "matka_records"), recordData);
                    alert("ડેટા સફળતાપૂર્વક સેવ થઈ ગયો છે!");
                }

                document.getElementById('matkaForm').reset();
                document.getElementById('recordId').value = '';
                document.getElementById('submitBtn').innerText = "ડેટા સેવ કરો";
                document.getElementById('submitBtn').classList.replace('bg-green-600', 'bg-blue-600');
                document.getElementById('cancelEditBtn').classList.add('hidden');
                dateInput.value = new Date().toISOString().split('T')[0];
                
                if (session === "Open" && !recordId) {
                    document.querySelector('input[name="sessionToggle"][value="Close"]').checked = true;
                } else {
                    document.querySelector('input[name="sessionToggle"][value="Open"]').checked = true;
                }
                updateToggleUI();

                document.getElementById('previewAnk').innerText = '-';
                document.getElementById('previewGroup').innerText = '-';
                document.getElementById('previewPanelType').innerText = '-';
                
                fetchLastEntry();
            } catch (error) {
                alert("ભૂલ આવી છે: " + error.message);
            }
        });
    </script>
</body>
</html>
