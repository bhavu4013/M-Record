&lt;script type=&quot;module&quot;&gt;

import { getFirestore, collection, getDocs } from &quot;https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js&quot;;

const firebaseConfig = {
  apiKey: &quot;AIzaSyC7lVQlcPhEGv2V-UwlQ7d6Dq-eXb8boqQ&quot;,

  projectId: &quot;m-record-f9c51&quot;,
  storageBucket: &quot;m-record-f9c51.firebasestorage.app&quot;,
  messagingSenderId: &quot;479303152172&quot;,
  appId: &quot;1:479303152172:web:3cc53dcecc9e8ce1ebd789&quot;
};

const db = getFirestore(initializeApp(firebaseConfig));

const el = {
  market: document.getElementById(&quot;marketSelect&quot;),

const FAMILY_JODI_GROUPS = {
  &quot;11&quot;:[&quot;11&quot;,&quot;16&quot;,&quot;61&quot;,&quot;66&quot;],
  &quot;12&quot;:[&quot;12&quot;,&quot;17&quot;,&quot;21&quot;,&quot;26&quot;,&quot;62&quot;,&quot;67&quot;,&quot;71&quot;,&quot;76&quot;],
  &quot;13&quot;:[&quot;13&quot;,&quot;18&quot;,&quot;31&quot;,&quot;36&quot;,&quot;63&quot;,&quot;68&quot;,&quot;81&quot;,&quot;86&quot;],
  &quot;14&quot;:[&quot;14&quot;,&quot;19&quot;,&quot;41&quot;,&quot;46&quot;,&quot;64&quot;,&quot;69&quot;,&quot;91&quot;,&quot;96&quot;],
  &quot;15&quot;:[&quot;10&quot;,&quot;15&quot;,&quot;60&quot;,&quot;65&quot;,&quot;01&quot;,&quot;06&quot;,&quot;51&quot;,&quot;56&quot;],
  &quot;22&quot;:[&quot;22&quot;,&quot;27&quot;,&quot;72&quot;,&quot;77&quot;],
  &quot;23&quot;:[&quot;23&quot;,&quot;28&quot;,&quot;32&quot;,&quot;37&quot;,&quot;73&quot;,&quot;78&quot;,&quot;82&quot;,&quot;87&quot;],
  &quot;24&quot;:[&quot;24&quot;,&quot;29&quot;,&quot;42&quot;,&quot;47&quot;,&quot;74&quot;,&quot;79&quot;,&quot;92&quot;,&quot;97&quot;],
  &quot;25&quot;:[&quot;20&quot;,&quot;25&quot;,&quot;52&quot;,&quot;57&quot;,&quot;70&quot;,&quot;75&quot;,&quot;02&quot;,&quot;07&quot;],
  &quot;33&quot;:[&quot;33&quot;,&quot;38&quot;,&quot;83&quot;,&quot;88&quot;],
  &quot;34&quot;:[&quot;34&quot;,&quot;39&quot;,&quot;43&quot;,&quot;48&quot;,&quot;84&quot;,&quot;89&quot;,&quot;93&quot;,&quot;98&quot;],
  &quot;35&quot;:[&quot;30&quot;,&quot;35&quot;,&quot;53&quot;,&quot;58&quot;,&quot;80&quot;,&quot;85&quot;,&quot;03&quot;,&quot;08&quot;],
  &quot;44&quot;:[&quot;44&quot;,&quot;49&quot;,&quot;94&quot;,&quot;99&quot;],
  &quot;45&quot;:[&quot;40&quot;,&quot;45&quot;,&quot;54&quot;,&quot;59&quot;,&quot;90&quot;,&quot;95&quot;,&quot;04&quot;,&quot;09&quot;],
  &quot;55&quot;:[&quot;00&quot;,&quot;05&quot;,&quot;50&quot;,&quot;55&quot;]
};

const groups = Object.keys(FAMILY_JODI_GROUPS);
let allRows = [], stats = {}, top5 = [], mid5 = [], recent5 = [];

function digit(v) {
  if (v === undefined || v === null || v === &quot;&quot;) return null;
  const n = parseInt(v, 10);
  return Number.isFinite(n) ? ((n % 10) + 10) % 10 : null;
}

function jodiOf(r) {
  const o = digit(r.openAnk ?? r.openDigit ?? r.open);
  const c = digit(r.closeAnk ?? r.closeDigit ?? r.close);
  return o === null || c === null ? null : String(o) + String(c);
}

function timeMin(s) {
  if (!s) return 1439;
  const m = String(s).match(/(\d{1,2}):(\d{2})/);
  return m ? parseInt(m[1],10) * 60 + parseInt(m[2],10) : 1439;
}

function dateValue(v) {
  if (v &amp;&amp; typeof v.toDate === &quot;function&quot;) {
    const d = v.toDate();
    return d instanceof Date &amp;&amp; !isNaN(d) ? d.getTime() : 0;
  }
  if (v &amp;&amp; typeof v.seconds === &quot;number&quot;) return v.seconds * 1000;
  const d = new Date(v);
  return d instanceof Date &amp;&amp; !isNaN(d) ? d.getTime() : 0;
}

function sortRows(rows) {
  return rows.slice().sort((a,b) =&gt;
    dateValue(a.date) - dateValue(b.date) ||
    timeMin(a.openTime) - timeMin(b.openTime)
  );
}

function setStatus(text, error=false) {
  el.status.textContent = text;
  el.status.className = &quot;mt-2 text-[10px] font-bold &quot; +
    (error ? &quot;text-red-600&quot; : &quot;text-slate-500&quot;);
}

async function load() {
  setStatus(&quot;Loading Firebase data...&quot;);
  try {
    const [mSnap, rSnap] = await Promise.all([
      getDocs(collection(db, &quot;markets&quot;)),
      getDocs(collection(db, &quot;matka_records&quot;))
    ]);

    const markets = [];
    mSnap.forEach(d =&gt; markets.push({id:d.id, ...d.data()}));
    markets.sort((a,b) =&gt; timeMin(a.openTime) - timeMin(b.openTime));

    const previous = el.market.value || &quot;ALL_MERGED&quot;;
    el.market.innerHTML = '&lt;option value=&quot;ALL_MERGED&quot;&gt;ALL MARKETS (MERGED)&lt;/option&gt;';

    markets.forEach(m =&gt; {
      if (!m.name) return;
      const opt = document.createElement(&quot;option&quot;);
      opt.value = m.name;
      opt.textContent = m.name;
      el.market.appendChild(opt);
    });

    el.market.value = [...el.market.options].some(o =&gt; o.value === previous)
      ? previous : &quot;ALL_MERGED&quot;;

    allRows = [];
    rSnap.forEach(d =&gt; {
      const r = d.data();
      if (r.date &amp;&amp; r.marketName) {
        allRows.push({
          ...r,
          id:d.id,
          openTime:r.openTime ||
            markets.find(m =&gt; m.name === r.marketName)?.openTime || &quot;00:00&quot;
        });
      }
    });

    calculate();
  } catch(e) {
    console.error(e);
    setStatus(&quot;ERROR: &quot; + (e?.message || String(e)), true);
    el.groupGrid.innerHTML =
      '&lt;div class=&quot;col-span-full text-center py-6 text-xs font-bold text-red-600&quot;&gt;' +
      'Firebase data load failed.&lt;br&gt;&lt;span class=&quot;text-[10px] text-slate-500&quot;&gt;' +
      'Check Firebase configuration / Firestore access.&lt;/span&gt;&lt;/div&gt;';
  }
}

function calculate() {
  const selected = el.market.value || &quot;ALL_MERGED&quot;;

  // Only completed Jodi results are counted.
  // A completed game = Open + Close both available.
  const rows = sortRows(
    allRows
      .filter(r =&gt; selected === &quot;ALL_MERGED&quot; || r.marketName === selected)
      .filter(r =&gt; jodiOf(r) !== null)
  );

  const n = rows.length;

  stats = Object.fromEntries(groups.map(g =&gt; [g, {
    occurrences: [],
    currentDelay: n,
    maxDelay: n,
    lastSeen: -1,
    count: 0
  }]));

  /*
    LOCKED FAMILY JODI DELAY RULE:

    If the Jodi of a completed game belongs to a Family-Jodi group,
    THAT GROUP is considered HIT for that game.

    Example:
      Group 12 contains 12,17,21,26,62,67,71,76.
      If today's complete Jodi is 67,
      Group 12 HIT =&gt; Group 12 Delay = 0.

    The next completed game without any Group-12 Jodi:
      Delay = 1
    next:
      Delay = 2
    next:
      Delay = 3

    So delay is ALWAYS reset by the latest Jodi hit of that group.
  */

  // Build a direct Jodi -&gt; Family Group map.
  // Every Jodi belongs to exactly one locked Family Group.
  const jodiToGroup = {};
  groups.forEach(g =&gt; {
    FAMILY_JODI_GROUPS[g].forEach(j =&gt; {
      jodiToGroup[String(j).padStart(2, &quot;0&quot;)] = g;
    });
  });

  // Record EVERY hit of each Family Group.
  // A group is hit when ANY Jodi/member belonging to that group occurs.
  rows.forEach((r, i) =&gt; {
    const j = jodiOf(r);
    const group = jodiToGroup[j];

    if (group) {
      stats[group].occurrences.push(i);
      stats[group].lastSeen = i;
      stats[group].count++;
    }
  });

  groups.forEach(g =&gt; {
    const s = stats[g];
    const hits = s.occurrences;

    // EXACT GROUP DELAY COUNT:
    // Find the latest hit of ANY member Jodi in this Family Group.
    // Group delay = completed games since that latest group hit.
    s.currentDelay = hits.length
      ? n - 1 - hits[hits.length - 1]
      : n;

    // Keep Max Delay only as informational data.
    const gaps = hits.length ? [hits[0]] : [n];

    for (let i = 1; i &lt; hits.length; i++) {
      gaps.push(hits[i] - hits[i - 1] - 1);
    }

    if (hits.length) {
      gaps.push(n - 1 - hits[hits.length - 1]);
    }

    s.maxDelay = Math.max(0, ...gaps);
  });

  const arr = groups.map(g =&gt; ({ group: g, ...stats[g] }));

  // TOP/MID/RECENT are based ONLY on the 15 FAMILY GROUP names
  // and their GROUP DELAY COUNT.
  // Max Delay is NOT used for this classification.
  const delaySorted = arr.slice().sort((a, b) =&gt;
    b.currentDelay - a.currentDelay ||
    a.group.localeCompare(b.group)
  );

  top5 = delaySorted.slice(0, 5);
  mid5 = delaySorted.slice(5, 10);
  recent5 = delaySorted.slice(10, 15);

  // Category delay uses the latest hit of ANY member in the category,
  // exactly like the uploaded Open Digit Analysis page.
  function getGroupDelay(list) {
    const lastSeen = list.reduce(
      (mx, x) =&gt; Math.max(mx, Number.isFinite(x.lastSeen) ? x.lastSeen : -1),
      -1
    );
    return lastSeen &gt;= 0 ? Math.max(0, n - 1 - lastSeen) : n;
  }

  el.topDelaySummary.textContent =
    `DELAY: ${getGroupDelay(top5)}`;
  el.midDelaySummary.textContent =
    `DELAY: ${getGroupDelay(mid5)}`;
  el.recentDelaySummary.textContent =
    `DELAY: ${getGroupDelay(recent5)}`;

  renderGroups(arr, &quot;ALL&quot;);

  setStatus(
    `${n} completed Jodi games • Group hit = any member Jodi occurred`
  );
}

function badges() {
  return {
    top:new Set(top5.map(x=&gt;x.group)),
    mid:new Set(mid5.map(x=&gt;x.group)),
    recent:new Set(recent5.map(x=&gt;x.group))
  };
}

function renderGroups(arr, mode) {
  const b = badges();
  let list = arr;
  if (mode === &quot;TOP&quot;) list = top5;
  if (mode === &quot;MID&quot;) list = mid5;
  if (mode === &quot;RECENT&quot;) list = recent5;

  el.filterLabel.textContent = mode;
  el.groupGrid.innerHTML = &quot;&quot;;

  list.forEach(x =&gt; {
    const cls = b.top.has(x.group)
      ? &quot;border-orange-400 bg-orange-50&quot;
      : b.mid.has(x.group)
      ? &quot;border-indigo-400 bg-indigo-50&quot;
      : b.recent.has(x.group)
      ? &quot;border-emerald-400 bg-emerald-50&quot;
      : &quot;border-slate-200 bg-slate-50&quot;;

    const card = document.createElement(&quot;div&quot;);
    card.className = `rounded-lg border p-2 text-center ${cls}`;
    card.innerHTML = `
      &lt;div class=&quot;text-sm font-black&quot;&gt;${x.group}&lt;/div&gt;
      &lt;div class=&quot;text-[9px] font-bold text-indigo-700&quot;&gt;D ${x.currentDelay}&lt;/div&gt;
      &lt;div class=&quot;text-[8px] font-bold text-slate-500&quot;&gt;H ${x.count}&lt;/div&gt;`;
    el.groupGrid.appendChild(card);
  });
}

function showDigit(d) {
  const related = groups.filter(g =&gt;
    FAMILY_JODI_GROUPS[g].some(j =&gt; j.includes(String(d)))
  );
  const b = badges();

  el.modalTitle.textContent = `DIGIT ${d} • FAMILY JODI`;
  el.modalBody.innerHTML = &quot;&quot;;

  related.forEach(g =&gt; {
    const x = stats[g];
    const tag = b.top.has(g)
      ? '&lt;span class=&quot;ml-1 text-[7px] font-black text-orange-700&quot;&gt;TOP&lt;/span&gt;'
      : b.mid.has(g)
      ? '&lt;span class=&quot;ml-1 text-[7px] font-black text-indigo-700&quot;&gt;MID&lt;/span&gt;'
      : b.recent.has(g)
      ? '&lt;span class=&quot;ml-1 text-[7px] font-black text-emerald-700&quot;&gt;RECENT&lt;/span&gt;'
      : &quot;&quot;;

    const row = document.createElement(&quot;div&quot;);
    row.className = &quot;rounded-xl border p-2 bg-slate-50&quot;;
    row.innerHTML = `
      &lt;div class=&quot;flex items-center justify-between&quot;&gt;
        &lt;div&gt;&lt;span class=&quot;text-base font-black&quot;&gt;${g}&lt;/span&gt;${tag}&lt;/div&gt;
        &lt;div class=&quot;text-right&quot;&gt;
          &lt;div class=&quot;text-[10px] font-black text-indigo-700&quot;&gt;Delay: ${x.currentDelay}&lt;/div&gt;
          &lt;div class=&quot;text-[9px] font-bold text-slate-500&quot;&gt;
            Hits: ${x.count}
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;mt-1 text-[8px] font-semibold text-slate-500&quot;&gt;
        Jodi: ${FAMILY_JODI_GROUPS[g].join(&quot;, &quot;)}
      &lt;/div&gt;`;
    el.modalBody.appendChild(row);
  });

  el.modal.classList.remove(&quot;hidden&quot;);
}

function initDigits() {
  el.digitGrid.innerHTML = &quot;&quot;;
  for (let d=0; d&lt;=9; d++) {
    const btn = document.createElement(&quot;button&quot;);
    btn.className =
      &quot;py-2 rounded-xl bg-indigo-600 text-white font-black text-sm shadow-sm active:scale-95 transition&quot;;
    btn.textContent = d;
    btn.addEventListener(&quot;click&quot;, () =&gt; showDigit(d));
    el.digitGrid.appendChild(btn);
  }
}

el.market.addEventListener(&quot;change&quot;, calculate);
el.refresh.addEventListener(&quot;click&quot;, load);
el.top.addEventListener(&quot;click&quot;, () =&gt; renderGroups(top5, &quot;TOP&quot;));
el.mid.addEventListener(&quot;click&quot;, () =&gt; renderGroups(mid5, &quot;MID&quot;));
el.recent.addEventListener(&quot;click&quot;, () =&gt; renderGroups(recent5, &quot;RECENT&quot;));
el.closeModal.addEventListener(&quot;click&quot;, () =&gt; el.modal.classList.add(&quot;hidden&quot;));
el.modal.addEventListener(&quot;click&quot;, e =&gt; {
  if (e.target === el.modal) el.modal.classList.add(&quot;hidden&quot;);
});

initDigits();
load();

 const family={},n=rs.length;
 Object.keys(FAMILY_JODI_GROUPS).forEach(g=&gt;{const o=famOcc[g]||[];if(o.length){const gaps=[o[0]];for(let i=1;i&lt;o.length;i++)gaps.push(o[i]-o[i-1]-1);gaps.push(n-1-o[o.length-1]);family[g]={delay:n-1-o[o.length-1],max:Math.max(...gaps),hits:o.length}}else family[g]={delay:n,max:n,hits:0}});
 return {total,diff,parity,family,common:{total:topFactorSet(total),diff:topFactorSet(diff),parity:topFactorSet(parity),family:topFactorSet(family)}}
}
function directJodiStats(rs){
 const n=rs.length,occ={};rs.forEach((r,i)=&gt;{const j=jodiOf(r);if(j)(occ[j]??=[]).push(i)});
 const out={};for(let i=0;i&lt;100;i++){const j=String(i).padStart(2,&quot;0&quot;),o=occ[j]||[];out[j]={delay:o.length?n-1-o[o.length-1]:n,hits:o.length}}return out
}
function scoreJodi(j,rs,L,J){
 const o=Number(j[0]),c=Number(j[1]),total=(o+c)%10,diff=(c-o+10)%10,par=(o%2?&quot;O&quot;:&quot;E&quot;)+(c%2?&quot;O&quot;:&quot;E&quot;),fam=JODI_TO_FAMILY[j];
 const T=L.total[String(total)]||{delay:rs.length,hits:0},D=L.diff[String(diff)]||{delay:rs.length,hits:0},F=L.family[fam]||{delay:rs.length,hits:0},P=L.parity[par]||{delay:rs.length,hits:0},direct=J[j]||{delay:rs.length,hits:0};
 const common=[L.common.total.has(String(total)),L.common.diff.has(String(diff)),L.common.family.has(String(fam)),L.common.parity.has(String(par))].filter(Boolean).length;
 const support=[T.delay&gt;0,D.delay&gt;0,F.delay&gt;0,P.delay&gt;0].filter(Boolean).length;
 const delayTie=T.delay+D.delay+F.delay+P.delay;
 return {jodi:j,common,support,delayTie,direct:direct.delay,T:T.delay,D:D.delay,F:F.delay,P:P.delay,total,diff,family:fam,parity:par}
}
function makeJodis(selected,side,rs){
 const L=layerStats(rs),J=directJodiStats(rs),result=[];
 selected.forEach(d=&gt;{
  const c=[];
  for(let x=0;x&lt;10;x++){const j=side===&quot;CLOSE&quot;?String(x)+String(d):String(d)+String(x);c.push(scoreJodi(j,rs,L,J))}
  c.sort((a,b)=&gt;b.common-a.common||b.support-a.support||b.delayTie-a.delayTie||b.direct-a.direct||a.jodi.localeCompare(b.jodi));
  result.push({digit:d,jodis:c.slice(0,3)});
 });
 return result
}

   &lt;div class=&quot;flex justify-center items-center gap-2 mt-4&quot;&gt;${selected.map((d,i)=&gt;`${i?'&lt;span class=&quot;text-2xl text-slate-300 font-black&quot;&gt;•&lt;/span&gt;':&quot;&quot;}&lt;div class=&quot;w-14 h-14 rounded-2xl ${side===&quot;CLOSE&quot;?&quot;bg-rose-50 text-rose-700&quot;:&quot;bg-indigo-50 text-indigo-700&quot;} flex items-center justify-center text-2xl font-black&quot;&gt;${d}&lt;/div&gt;`).join(&quot;&quot;)}&lt;/div&gt;
   &lt;div class=&quot;mt-3 text-[9px] font-black text-slate-600&quot;&gt;JODI LOGIC: COMMON FACTOR FIRST&lt;/div&gt;

  &lt;/div&gt;
  &lt;div class=&quot;space-y-3 mt-3&quot;&gt;
   ${groups.map(g=&gt;`&lt;div class=&quot;card p-4&quot;&gt;&lt;div class=&quot;flex items-center justify-between mb-3&quot;&gt;&lt;div class=&quot;text-xl font-black&quot;&gt;DIGIT ${g.digit}&lt;/div&gt;&lt;div class=&quot;text-[9px] font-black text-slate-400&quot;&gt;3 BEST JODI&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid grid-cols-3 gap-2&quot;&gt;${g.jodis.map(x=&gt;`&lt;div class=&quot;rounded-xl border border-slate-200 bg-slate-50 p-2 text-center&quot;&gt;&lt;div class=&quot;text-2xl font-black&quot;&gt;${x.jodi}&lt;/div&gt;&lt;div class=&quot;text-[8px] font-black text-indigo-600 mt-1&quot;&gt;COMMON ${x.common}/4&lt;/div&gt;&lt;div class=&quot;text-[7px] text-slate-400 font-bold mt-1&quot;&gt;T ${x.T} • D ${x.D} • F ${x.F} • OE ${x.P}&lt;/div&gt;&lt;/div&gt;`).join(&quot;&quot;)}&lt;/div&gt;&lt;/div&gt;`).join(&quot;&quot;)}
  &lt;/div&gt;`;
  $(&quot;status&quot;).textContent=`${$(&quot;market&quot;).value===&quot;ALL_MERGED&quot;?&quot;ALL MARKETS&quot;:$(&quot;market&quot;).value} • ${rs.length} GAMES • PLAY ${side} • 3 DIGITS • ${groups.length*3} JODI`;
 }catch(e){console.error(e);$(&quot;status&quot;).textContent=&quot;DATA ERROR: &quot;+(e.message||e);$(&quot;result&quot;).innerHTML=`&lt;div class=&quot;card p-4 text-xs font-bold text-red-600&quot;&gt;${e.message||e}&lt;/div&gt;`}

$(&quot;market&quot;).onchange=render;$(&quot;refresh&quot;).onclick=load;load();
