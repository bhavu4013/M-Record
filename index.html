<!-- SHORTLIST SECTION --> 
<div id="shortlistSection" class="hidden space-y-4 w-full"> 
<div class="space-y-3"> 
<div class="space-y-1"> 
<label class="block text-xs font-semibold text-slate-600 uppercase">Select Market</label> 
<select id="shortlistMarketSelect" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none bg-white font-semibold text-slate-800"> 
<option value="">All Markets (Merged)</option> 
</select> 
</div> 
<div class="space-y-3 pt-1"> 
<!-- Rule 1 Output -->
<div class="bg-indigo-50 border border-indigo-200 p-3 rounded-xl shadow-sm space-y-1"> 
<div class="text-xs font-bold text-indigo-700 uppercase">🔥 Rule 1 (Open View) Output</div> 
<div id="rule1Output" class="text-sm font-black text-slate-800 tracking-wider">-</div> 
</div> 
<!-- Rule 2 Output -->
<div class="bg-blue-50 border border-blue-200 p-3 rounded-xl shadow-sm space-y-1"> 
<div class="text-xs font-bold text-blue-700 uppercase">🔥 Rule 2 (Close View) Output (4 Digits)</div> 
<div id="rule2Output" class="text-sm font-black text-slate-800 tracking-wider">-</div> 
</div> 
<!-- Rule 3 Output -->
<div class="bg-emerald-50 border border-emerald-200 p-3 rounded-xl shadow-sm space-y-1"> 
<div class="text-xs font-bold text-emerald-700 uppercase">🔥 Rule 3 (Total View) Output (4 Digits)</div> 
<div id="rule3Output" class="text-sm font-black text-slate-800 tracking-wider">-</div> 
</div> 
<!-- Rule 4 Output -->
<div class="bg-amber-50 border border-amber-200 p-3 rounded-xl shadow-sm space-y-1"> 
<div class="text-xs font-bold text-amber-700 uppercase">🔥 Rule 4 (Diff View) Output (4 Digits)</div> 
<div id="rule4Output" class="text-sm font-black text-slate-800 tracking-wider">-</div> 
</div> 
</div> 
<button type="button" id="generateShortlistBtn" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold text-sm hover:bg-indigo-700 shadow-md transition">Apply Rules & Generate</button> 
</div> 
</div>
