    <!-- Add Market Modal (પોપઅપ વિન્ડો) -->
    <div id="marketModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden p-4">
        <div class="bg-white p-6 rounded-lg max-w-sm w-full space-y-3 max-h-[90vh] overflow-y-auto">
            <h3 class="text-lg font-bold text-gray-800">નવી માર્કેટ ઉમેરો</h3>
            
            <div>
                <label class="block text-sm font-medium text-gray-700">માર્કેટનું નામ</label>
                <input type="text" id="newMarketName" class="mt-1 block w-full border border-gray-300 rounded-md p-2" placeholder="દા.ત. Kalyan">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">ઓપન ટાઈમ (Open Time)</label>
                <input type="time" id="openTime" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
            </div>

            <!-- नया फील्ड: ओपन रिजल्ट टाइम -->
            <div>
                <label class="block text-sm font-medium text-gray-700">ઓપન રિઝલ્ટ ટાઈમ (Open Result Time)</label>
                <input type="time" id="openResultTime" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">ક્લોઝ ટાઈમ (Close Time)</label>
                <input type="time" id="closeTime" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
            </div>

            <!-- नया फील्ड: क्लोज रिजल्ट टाइम -->
            <div>
                <label class="block text-sm font-medium text-gray-700">ક્લોઝ રિઝલ્ટ ટાઈમ (Close Result Time)</label>
                <input type="time" id="closeResultTime" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">રિઝલ્ટ ટાઈમ (Result Time / Final)</label>
                <input type="time" id="resultTime" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
            </div>

            <div class="flex gap-2 pt-2">
                <button type="button" id="saveMarketBtn" class="flex-1 bg-green-600 text-white py-2 rounded-md font-semibold hover:bg-green-700">સેવ કરો</button>
                <button type="button" id="closeModalBtn" class="flex-1 bg-gray-400 text-white py-2 rounded-md font-semibold hover:bg-gray-500">બંધ કરો</button>
            </div>
        </div>
    </div>
