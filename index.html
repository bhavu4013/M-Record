const FAMILY_JODI_GROUPS = {

  &quot;14&quot;:[&quot;14&quot;,&quot;19&quot;,&quot;41&quot;,&quot;46&quot;,&quot;64&quot;,&quot;69&quot;,&quot;91&quot;,&quot;96&quot;],
  &quot;15&quot;:[&quot;10&quot;,&quot;15&quot;,&quot;60&quot;,&quot;65&quot;,&quot;01&quot;,&quot;06&quot;,&quot;51&quot;,&quot;56&quot;],

  &quot;24&quot;:[&quot;24&quot;,&quot;29&quot;,&quot;42&quot;,&quot;47&quot;,&quot;74&quot;,&quot;79&quot;,&quot;92&quot;,&quot;97&quot;],
  &quot;25&quot;:[&quot;20&quot;,&quot;25&quot;,&quot;52&quot;,&quot;57&quot;,&quot;70&quot;,&quot;75&quot;,&quot;02&quot;,&quot;07&quot;],
  &quot;33&quot;:[&quot;33&quot;,&quot;38&quot;,&quot;83&quot;,&quot;88&quot;],
  &quot;34&quot;:[&quot;34&quot;,&quot;39&quot;,&quot;43&quot;,&quot;48&quot;,&quot;84&quot;,&quot;89&quot;,&quot;93&quot;,&quot;98&quot;],
  &quot;35&quot;:[&quot;30&quot;,&quot;35&quot;,&quot;53&quot;,&quot;58&quot;,&quot;80&quot;,&quot;85&quot;,&quot;03&quot;,&quot;08&quot;],
  &quot;44&quot;:[&quot;44&quot;,&quot;49&quot;,&quot;94&quot;,&quot;99&quot;],
  &quot;45&quot;:[&quot;40&quot;,&quot;45&quot;,&quot;54&quot;,&quot;59&quot;,&quot;90&quot;,&quot;95&quot;,&quot;04&quot;,&quot;09&quot;],

const groups = Object.keys(FAMILY_JODI_GROUPS);

function digit(v) {
  if (v === undefined || v === null || v === &quot;&quot;) return null;
  const n = parseInt(v, 10);
  return Number.isFinite(n) ? ((n % 10) + 10) % 10 : null;
}

function jodiOf(r) {
  const o = digit(r.openAnk ?? r.openDigit ?? r.open);
  const c = digit(r.closeAnk ?? r.closeDigit ?? r.close);
  return o === null || c === null ? null : String(o) + String(c);
}

function timeMin(s) {
  if (!s) return 1439;
  const m = String(s).match(/(\d{1,2}):(\d{2})/);
  return m ? parseInt(m[1],10) * 60 + parseInt(m[2],10) : 1439;
}

function dateValue(v) {
  if (v &amp;&amp; typeof v.toDate === &quot;function&quot;) {
    const d = v.toDate();
    return d instanceof Date &amp;&amp; !isNaN(d) ? d.getTime() : 0;
  }
  if (v &amp;&amp; typeof v.seconds === &quot;number&quot;) return v.seconds * 1000;
  const d = new Date(v);
  return d instanceof Date &amp;&amp; !isNaN(d) ? d.getTime() : 0;
}

function sortRows(rows) {
  return rows.slice().sort((a,b) =&gt;
    dateValue(a.date) - dateValue(b.date) ||
    timeMin(a.openTime) - timeMin(b.openTime)
  );
}

function setStatus(text, error=false) {
  el.status.textContent = text;
  el.status.className = &quot;mt-2 text-[10px] font-bold &quot; +
    (error ? &quot;text-red-600&quot; : &quot;text-slate-500&quot;);
}

async function load() {
  setStatus(&quot;Loading Firebase data...&quot;);
  try {
    const [mSnap, rSnap] = await Promise.all([
      getDocs(collection(db, &quot;markets&quot;)),
      getDocs(collection(db, &quot;matka_records&quot;))
    ]);

    const markets = [];
    mSnap.forEach(d =&gt; markets.push({id:d.id, ...d.data()}));
    markets.sort((a,b) =&gt; timeMin(a.openTime) - timeMin(b.openTime));

    const previous = el.market.value || &quot;ALL_MERGED&quot;;
    el.market.innerHTML = &#x27;&lt;option value=&quot;ALL_MERGED&quot;&gt;ALL MARKETS (MERGED)&lt;/option&gt;&#x27;;

    markets.forEach(m =&gt; {
      if (!m.name) return;
      const opt = document.createElement(&quot;option&quot;);
      opt.value = m.name;
      opt.textContent = m.name;
      el.market.appendChild(opt);
    });

    el.market.value = [...el.market.options].some(o =&gt; o.value === previous)
      ? previous : &quot;ALL_MERGED&quot;;

    allRows = [];
    rSnap.forEach(d =&gt; {
      const r = d.data();
      if (r.date &amp;&amp; r.marketName) {
        allRows.push({
          ...r,
          id:d.id,
          openTime:r.openTime ||
            markets.find(m =&gt; m.name === r.marketName)?.openTime || &quot;00:00&quot;
        });
      }
    });

    calculate();
  } catch(e) {
    console.error(e);
    setStatus(&quot;ERROR: &quot; + (e?.message || String(e)), true);
    el.groupGrid.innerHTML =
      &#x27;&lt;div class=&quot;col-span-full text-center py-6 text-xs font-bold text-red-600&quot;&gt;&#x27; +
      &#x27;Firebase data load failed.&lt;br&gt;&lt;span class=&quot;text-[10px] text-slate-500&quot;&gt;&#x27; +
      &#x27;Check Firebase configuration / Firestore access.&lt;/span&gt;&lt;/div&gt;&#x27;;
  }
}

function calculate() {
  const selected = el.market.value || &quot;ALL_MERGED&quot;;

  // Only completed Jodi results are counted.
  // A completed game = Open + Close both available.
  const rows = sortRows(
    allRows
      .filter(r =&gt; selected === &quot;ALL_MERGED&quot; || r.marketName === selected)
      .filter(r =&gt; jodiOf(r) !== null)
  );

  const n = rows.length;

  stats = Object.fromEntries(groups.map(g =&gt; [g, {
    occurrences: [],
    currentDelay: n,
    maxDelay: n,
    lastSeen: -1,
    count: 0
  }]));

  /*
    LOCKED FAMILY JODI DELAY RULE:

    If the Jodi of a completed game belongs to a Family-Jodi group,
    THAT GROUP is considered HIT for that game.

    Example:
      Group 12 contains 12,17,21,26,62,67,71,76.
      If today&#x27;s complete Jodi is 67,
      Group 12 HIT =&gt; Group 12 Delay = 0.

    The next completed game without any Group-12 Jodi:
      Delay = 1
    next:
      Delay = 2
    next:
      Delay = 3

    So delay is ALWAYS reset by the latest Jodi hit of that group.
  */

  // Build a direct Jodi -&gt; Family Group map.
  // Every Jodi belongs to exactly one locked Family Group.
  const jodiToGroup = {};
  groups.forEach(g =&gt; {
    FAMILY_JODI_GROUPS[g].forEach(j =&gt; {
      jodiToGroup[String(j).padStart(2, &quot;0&quot;)] = g;
    });
  });

  // Record EVERY hit of each Family Group.
  // A group is hit when ANY Jodi/member belonging to that group occurs.
  rows.forEach((r, i) =&gt; {
    const j = jodiOf(r);
    const group = jodiToGroup[j];

    if (group) {
      stats[group].occurrences.push(i);
      stats[group].lastSeen = i;
      stats[group].count++;
    }
  });

  groups.forEach(g =&gt; {
    const s = stats[g];
    const hits = s.occurrences;

    // EXACT GROUP DELAY COUNT:
    // Find the latest hit of ANY member Jodi in this Family Group.
    // Group delay = completed games since that latest group hit.
    s.currentDelay = hits.length
      ? n - 1 - hits[hits.length - 1]
      : n;

    // Keep Max Delay only as informational data.
    const gaps = hits.length ? [hits[0]] : [n];

    for (let i = 1; i &lt; hits.length; i++) {
      gaps.push(hits[i] - hits[i - 1] - 1);
    }

    if (hits.length) {
      gaps.push(n - 1 - hits[hits.length - 1]);
    }

    s.maxDelay = Math.max(0, ...gaps);
  });

  const arr = groups.map(g =&gt; ({ group: g, ...stats[g] }));

  // TOP/MID/RECENT are based ONLY on the 15 FAMILY GROUP names
  // and their GROUP DELAY COUNT.
  // Max Delay is NOT used for this classification.
  const delaySorted = arr.slice().sort((a, b) =&gt;
    b.currentDelay - a.currentDelay ||
    a.group.localeCompare(b.group)
  );

  top5 = delaySorted.slice(0, 5);
  mid5 = delaySorted.slice(5, 10);
  recent5 = delaySorted.slice(10, 15);

  // Category delay uses the latest hit of ANY member in the category,
  // exactly like the uploaded Open Digit Analysis page.
  function getGroupDelay(list) {
    const lastSeen = list.reduce(
      (mx, x) =&gt; Math.max(mx, Number.isFinite(x.lastSeen) ? x.lastSeen : -1),
      -1
    );
    return lastSeen &gt;= 0 ? Math.max(0, n - 1 - lastSeen) : n;
  }

  el.topDelaySummary.textContent =
    `DELAY: ${getGroupDelay(top5)}`;
  el.midDelaySummary.textContent =
    `DELAY: ${getGroupDelay(mid5)}`;
  el.recentDelaySummary.textContent =
    `DELAY: ${getGroupDelay(recent5)}`;

  renderGroups(arr, &quot;ALL&quot;);

  setStatus(
    `${n} completed Jodi games • Group hit = any member Jodi occurred`
  );
}

function badges() {
  return {
    top:new Set(top5.map(x=&gt;x.group)),
    mid:new Set(mid5.map(x=&gt;x.group)),
    recent:new Set(recent5.map(x=&gt;x.group))
  };
}

function renderGroups(arr, mode) {
  const b = badges();
  let list = arr;
  if (mode === &quot;TOP&quot;) list = top5;
  if (mode === &quot;MID&quot;) list = mid5;
  if (mode === &quot;RECENT&quot;) list = recent5;

  el.filterLabel.textContent = mode;
  el.groupGrid.innerHTML = &quot;&quot;;

  list.forEach(x =&gt; {
    const cls = b.top.has(x.group)
      ? &quot;border-orange-400 bg-orange-50&quot;
      : b.mid.has(x.group)
      ? &quot;border-indigo-400 bg-indigo-50&quot;
      : b.recent.has(x.group)
      ? &quot;border-emerald-400 bg-emerald-50&quot;
      : &quot;border-slate-200 bg-slate-50&quot;;

    const card = document.createElement(&quot;div&quot;);
    card.className = `rounded-lg border p-2 text-center ${cls}`;
    card.innerHTML = `
      &lt;div class=&quot;text-sm font-black&quot;&gt;${x.group}&lt;/div&gt;
      &lt;div class=&quot;text-[9px] font-bold text-indigo-700&quot;&gt;D ${x.currentDelay}&lt;/div&gt;
      &lt;div class=&quot;text-[8px] font-bold text-slate-500&quot;&gt;H ${x.count}&lt;/div&gt;`;
    el.groupGrid.appendChild(card);
  });
}

function showDigit(d) {
  const related = groups.filter(g =&gt;
    FAMILY_JODI_GROUPS[g].some(j =&gt; j.includes(String(d)))
  );
  const b = badges();

  el.modalTitle.textContent = `DIGIT ${d} • FAMILY JODI`;
  el.modalBody.innerHTML = &quot;&quot;;

  related.forEach(g =&gt; {
    const x = stats[g];
    const tag = b.top.has(g)
      ? &#x27;&lt;span class=&quot;ml-1 text-[7px] font-black text-orange-700&quot;&gt;TOP&lt;/span&gt;&#x27;
      : b.mid.has(g)
      ? &#x27;&lt;span class=&quot;ml-1 text-[7px] font-black text-indigo-700&quot;&gt;MID&lt;/span&gt;&#x27;
      : b.recent.has(g)
      ? &#x27;&lt;span class=&quot;ml-1 text-[7px] font-black text-emerald-700&quot;&gt;RECENT&lt;/span&gt;&#x27;
      : &quot;&quot;;

    const row = document.createElement(&quot;div&quot;);
    row.className = &quot;rounded-xl border p-2 bg-slate-50&quot;;
    row.innerHTML = `
      &lt;div class=&quot;flex items-center justify-between&quot;&gt;
        &lt;div&gt;&lt;span class=&quot;text-base font-black&quot;&gt;${g}&lt;/span&gt;${tag}&lt;/div&gt;
        &lt;div class=&quot;text-right&quot;&gt;
          &lt;div class=&quot;text-[10px] font-black text-indigo-700&quot;&gt;Delay: ${x.currentDelay}&lt;/div&gt;
          &lt;div class=&quot;text-[9px] font-bold text-slate-500&quot;&gt;
            Hits: ${x.count}

        Jodi: ${FAMILY_JODI_GROUPS[g].join(&quot;, &quot;)}
      &lt;/div&gt;`;
    el.modalBody.appendChild(row);
  });

  el.modal.classList.remove(&quot;hidden&quot;);
}

function initDigits() {
  el.digitGrid.innerHTML = &quot;&quot;;
  for (let d=0; d&lt;=9; d++) {

    btn.textContent = d;
    btn.addEventListener(&quot;click&quot;, () =&gt; showDigit(d));
    el.digitGrid.appendChild(btn);
  }
}

 const m=String(v).match(/(\d{1,2})\s*[:.]\s*(\d{2})/);
 if(!m)return 1439;
 return Number(m[1])*60+Number(m[2]);
}
function rowsForMarket(){
 const selected=$(&quot;market&quot;).value||&quot;ALL_MERGED&quot;;
 return records.filter(r=&gt;{
   if(!r.date||!r.marketName)return false;
   if(openDigit(r)===null||closeDigit(r)===null)return false;
   return selected===&quot;ALL_MERGED&quot;||String(r.marketName)===selected;
 }).sort((a,b)=&gt;dateKey(a).localeCompare(dateKey(b))||
   timeMinutes(a.openTime)-timeMinutes(b.openTime));
}
function calculate(){
 const rows=rowsForMarket(),defs=mode===&quot;JODI&quot;?JODI:SINGLE,n=rows.length;
 const stats=Object.fromEntries(defs.map(d=&gt;[d.key,{
   ...d,occ:[],hits:0,last:-1,currentDelay:n,maxDelay:0,
   recent10:0,recent20:0,rate:0
 }]));
 rows.forEach((r,i)=&gt;{
   const k=pattern(r);
   if(stats[k]){stats[k].occ.push(i);stats[k].hits++;stats[k].last=i;}
 });
 defs.forEach(d=&gt;{
   const s=stats[d.key],o=s.occ;
   s.currentDelay=o.length?n-1-o[o.length-1]:n;
   const gaps=o.length?[o[0]]:[n];
   for(let i=1;i&lt;o.length;i++)gaps.push(o[i]-o[i-1]-1);
   if(o.length)gaps.push(n-1-o[o.length-1]);
   s.maxDelay=Math.max(0,...gaps);
   s.recent10=o.filter(i=&gt;i&gt;=Math.max(0,n-10)).length;
   s.recent20=o.filter(i=&gt;i&gt;=Math.max(0,n-20)).length;
   s.rate=n?(s.hits/n)*100:0;
 });
 const ranked=defs.map(d=&gt;stats[d.key]).sort((a,b)=&gt;
   b.currentDelay-a.currentDelay||b.maxDelay-a.maxDelay||b.hits-a.hits||a.key.localeCompare(b.key));
 return {rows,stats,ranked};
}

<script>
const buttons=[...document.querySelectorAll('.nav-btn')];
const frames=[...document.querySelectorAll('.page-frame')];
function openPage(index){
 buttons.forEach(b=>b.classList.toggle('active',Number(b.dataset.page)===index));
 frames.forEach(f=>f.style.display=Number((f.id||'').replace('page-',''))===index?'block':'none');
 try{localStorage.setItem('analysisPlatformPageV8',String(index));}catch(e){}
 if(index===11){
  const dp=document.getElementById('page-8');
  if(dp && dp.contentWindow)dp.contentWindow.postMessage({type:'REQUEST_DIGIT_PLAY_SIGNAL'},'*');
 }
}
buttons.forEach(b=>b.addEventListener('click',()=>openPage(Number(b.dataset.page))));
window.addEventListener("message",e=>{
 if(!e.data || e.data.type!=="DIGIT_PLAY_SIGNAL")return;
 const target=document.getElementById("page-11");
 if(target && target.contentWindow)target.contentWindow.postMessage(e.data,"*");
});

let saved=10;
try{saved=Number(localStorage.getItem('analysisPlatformPageV8')||10)}catch(e){}
if(!Number.isInteger(saved)||saved<0||saved>11)saved=10;
openPage(saved);
</script>
