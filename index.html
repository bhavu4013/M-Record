<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Data Logger Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-4 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white p-6 rounded-xl shadow-lg space-y-5">
        <h2 class="text-xl font-bold text-center text-slate-800 tracking-wide">Daily Activity Logger</h2>

        <!-- Last Entry Card -->
        <div id="lastEntryBox" class="bg-amber-50 border border-amber-200 p-4 rounded-lg shadow-sm text-sm text-amber-900 space-y-1">
            <p class="font-bold text-amber-950 flex items-center gap-1">📌 Last Entry:</p>
            <p id="lastEntryDetails" class="leading-relaxed">Loading...</p>
        </div>

        <!-- Alert Box -->
        <div id="entryAlertBox" class="hidden bg-red-50 border border-red-200 p-3 rounded-lg text-sm text-red-700 font-semibold text-center">
            ⚠️ <span id="alertMessageText">Entry for this session already exists! Switching to Update mode.</span>
        </div>

        <form id="matkaForm" class="space-y-4">
            <input type="hidden" id="recordId">

            <!-- Date -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Date</label>
                <input type="date" id="recordDate" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
            </div>

            <!-- Market, Add/Edit & Remove Buttons with Icons -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Market</label>
                <div class="flex gap-2">
                    <select id="marketDropdown" class="flex-1 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
                        <option value="">Select Market</option>
                    </select>
                    <!-- Add/Edit Icon Button -->
                    <button type="button" id="openModalBtn" class="bg-emerald-600 text-white px-3.5 py-2.5 rounded-lg hover:bg-emerald-700 shadow-sm transition flex items-center justify-center" title="Add / Edit Market">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                    </button>
                    <!-- Remove/Delete Icon Button -->
                    <button type="button" id="deleteMarketBtn" class="bg-red-600 text-white px-3.5 py-2.5 rounded-lg hover:bg-red-700 shadow-sm transition flex items-center justify-center" title="Delete Selected Market">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                </div>
            </div>

            <!-- Session Toggle Switch -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Session</label>
                <div class="flex items-center bg-slate-200 p-1 rounded-lg">
                    <label class="flex-1 text-center cursor-pointer py-1.5 rounded-md transition-all text-sm font-semibold" id="openLabel">
                        <input type="radio" name="sessionToggle" value="Open" checked class="hidden"> Open
                    </label>
                    <label class="flex-1 text-center cursor-pointer py-1.5 rounded-md transition-all text-sm font-semibold" id="closeLabel">
                        <input type="radio" name="sessionToggle" value="Close" class="hidden"> Close
                    </label>
                </div>
            </div>

            <!-- Panna Input -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">3-Digit Panna</label>
                <input type="text" id="pannaInput" maxlength="3" placeholder="e.g. 126" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
            </div>

            <!-- Auto Calculation Preview -->
            <div class="bg-slate-50 border border-slate-200 p-3.5 rounded-lg text-sm text-slate-700 space-y-1.5 shadow-inner">
                <div class="flex justify-between items-center">
                    <span class="text-slate-500 text-xs font-medium uppercase">Ank:</span>
                    <span id="previewAnk" class="font-bold text-slate-900">-</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-slate-500 text-xs font-medium uppercase">Group:</span>
                    <span id="previewGroup" class="font-bold text-slate-900">-</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-slate-500 text-xs font-medium uppercase">Family Group:</span>
                    <span id="previewFamilyGroup" class="font-bold text-amber-700">-</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-slate-500 text-xs font-medium uppercase">Type:</span>
                    <span id="previewPanelType" class="font-bold text-blue-600">-</span>
                </div>
            </div>

            <!-- Submit and Red Cancel Button -->
            <div class="flex gap-2 pt-1">
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-2.5 rounded-lg hover:bg-blue-700 font-semibold text-sm shadow-sm transition">Save Record</button>
                <button type="button" id="cancelEditBtn" class="hidden w-1/3 bg-red-600 text-white py-2.5 rounded-lg hover:bg-red-700 font-semibold text-sm transition flex items-center justify-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round5" d="M6 18L18 6M6 6l12 12"></path></svg> Cancel
                </button>
            </div>
        </form>
    </div>

    <!-- Add / Edit Market Modal -->
    <div id="marketModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center hidden p-4">
        <div class="bg-white p-6 rounded-xl max-w-sm w-full space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
            <h3 id="marketModalTitle" class="text-lg font-bold text-slate-800">Add New Market</h3>
            <input type="hidden" id="editMarketId">
            
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Market Name</label>
                <input type="text" id="newMarketName" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none" placeholder="e.g. Kalyan">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Open Time</label>
                <input type="time" id="openTime" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Close Time</label>
                <input type="time" id="closeTime" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none">
            </div>

            <!-- Working Days Checkboxes -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-2">Working Days</label>
                <div class="grid grid-cols-2 gap-2 text-xs text-slate-700">
                    <label class="flex items-center gap-1.5"><input type="checkbox" name="workingDay" value="Mon" checked class="rounded"> Monday</label>
                    <label class="flex items-center gap-1.5"><input type="checkbox" name="workingDay" value="Tue" checked class="rounded"> Tuesday</label>
                    <label class="flex items-center gap-1.5"><input type="checkbox" name="workingDay" value="Wed" checked class="rounded"> Wednesday</label>
                    <label class="flex items-center gap-1.5"><input type="checkbox" name="workingDay" value="Thu" checked class="rounded"> Thursday</label>
                    <label class="flex items-center gap-1.5"><input type="checkbox" name="workingDay" value="Fri" checked class="rounded"> Friday</label>
                    <label class="flex items-center gap-1.5"><input type="checkbox" name="workingDay" value="Sat" checked class="rounded"> Saturday</label>
                    <label class="flex items-center gap-1.5"><input type="checkbox" name="workingDay" value="Sun" checked class="rounded"> Sunday</label>
                </div>
            </div>

            <div class="flex gap-2 pt-2">
                <button type="button" id="saveMarketBtn" class="flex-1 bg-emerald-600 text-white py-2.5 rounded-lg font-semibold text-sm hover:bg-emerald-700 transition">Save Market</button>
                <button type="button" id="closeModalBtn" class="flex-1 bg-red-600 text-white py-2.5 rounded-lg font-semibold text-sm hover:bg-red-700 transition">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, getDocs, query, where, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyC7lVQlcPhEGv2V-UwlQ7d6Dq-eXb8boqQ",
          authDomain: "m-record-f9c51.firebaseapp.com",
          projectId: "m-record-f9c51",
          storageBucket: "m-record-f9c51.firebasestorage.app",
          messagingSenderId: "479303152172",
          appId: "1:479303152172:web:3cc53dcecc9e8ce1ebd789"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const dateInput = document.getElementById('recordDate');
        dateInput.value = new Date().toISOString().split('T')[0];

        let marketsList = [];

        const modal = document.getElementById('marketModal');
        
        // Open Modal for Add or Edit Market based on dropdown selection
        document.getElementById('openModalBtn').addEventListener('click', () => {
            let selectedMarketName = document.getElementById('marketDropdown').value;
            let marketObj = marketsList.find(m => m.name === selectedMarketName);

            if (marketObj) {
                // Edit Mode
                document.getElementById('editMarketId').value = marketObj.id;
                document.getElementById('newMarketName').value = marketObj.name;
                document.getElementById('openTime').value = marketObj.openTime || '';
                document.getElementById('closeTime').value = marketObj.closeTime || '';
                document.getElementById('marketModalTitle').innerText = "Update Market Details";
                document.getElementById('saveMarketBtn').innerText = "Update Market";

                let days = marketObj.workingDays || [];
                document.querySelectorAll('input[name="workingDay"]').forEach(cb => {
                    cb.checked = days.includes(cb.value);
                });
            } else {
                // Add Mode (If nothing selected or just adding new)
                document.getElementById('editMarketId').value = '';
                document.getElementById('newMarketName').value = '';
                document.getElementById('openTime').value = '';
                document.getElementById('closeTime').value = '';
                document.getElementById('marketModalTitle').innerText = "Add New Market";
                document.getElementById('saveMarketBtn').innerText = "Save Market";
                document.querySelectorAll('input[name="workingDay"]').forEach(cb => {
                    cb.checked = true;
                });
            }
            modal.classList.remove('hidden');
        });

        document.getElementById('closeModalBtn').addEventListener('click', () => modal.classList.add('hidden'));

        // Delete/Remove Market Functionality
        document.getElementById('deleteMarketBtn').addEventListener('click', async () => {
            let selectedMarketName = document.getElementById('marketDropdown').value;
            if (!selectedMarketName) {
                alert("Please select a market from the dropdown to delete!");
                return;
            }

            if (confirm(`Are you sure you want to delete the market "${selectedMarketName}"?`)) {
                let marketObj = marketsList.find(m => m.name === selectedMarketName);
                if (marketObj) {
                    try {
                        await deleteDoc(doc(db, "markets", marketObj.id));
                        alert("Market deleted successfully!");
                        loadMarkets();
                    } catch (error) {
                        alert("Error deleting market: " + error.message);
                    }
                }
            }
        });

        async function loadMarkets() {
            const marketDropdown = document.getElementById('marketDropdown');
            let currentSelected = marketDropdown.value;
            try {
                const querySnapshot = await getDocs(collection(db, "markets"));
                marketDropdown.innerHTML = '<option value="">Select Market</option>';
                marketsList = [];
                
                querySnapshot.forEach((docSnap) => {
                    let mData = docSnap.data();
                    marketsList.push({ id: docSnap.id, ...mData });
                    
                    let opt = document.createElement('option');
                    opt.value = mData.name;
                    opt.textContent = `${mData.name} (${mData.openTime || '-'} / ${mData.closeTime || '-'})`;
                    marketDropdown.appendChild(opt);
                });
                if (currentSelected) marketDropdown.value = currentSelected;
                checkValidationAndStatus();
            } catch (e) {
                console.log("Markets load error:", e);
            }
        }
        loadMarkets();

        document.getElementById('saveMarketBtn').addEventListener('click', async () => {
            let marketId = document.getElementById('editMarketId').value;
            let name = document.getElementById('newMarketName').value.trim();
            let openTime = document.getElementById('openTime').value;
            let closeTime = document.getElementById('closeTime').value;
            
            let workingDays = [];
            document.querySelectorAll('input[name="workingDay"]:checked').forEach(cb => {
                workingDays.push(cb.value);
            });

            if(!name) {
                alert("Please enter the market name!");
                return;
            }

            let existingMarket = marketsList.find(m => m.name.toLowerCase() === name.toLowerCase() && m.id !== marketId);
            if (existingMarket) {
                alert("Duplicate market error: This market name already exists!");
                return;
            }

            try {
                if (marketId) {
                    await updateDoc(doc(db, "markets", marketId), {
                        name: name,
                        openTime: openTime,
                        closeTime: closeTime,
                        workingDays: workingDays
                    });
                    alert("Market updated successfully!");
                } else {
                    await addDoc(collection(db, "markets"), {
                        name: name,
                        openTime: openTime,
                        closeTime: closeTime,
                        workingDays: workingDays,
                        timestamp: serverTimestamp()
                    });
                    alert("Market added successfully!");
                }

                modal.classList.add('hidden');
                loadMarkets();
            } catch (error) {
                alert("Error: " + error.message);
            }
        });

        const radioButtons = document.querySelectorAll('input[name="sessionToggle"]');
        const openLabel = document.getElementById('openLabel');
        const closeLabel = document.getElementById('closeLabel');

        function updateToggleUI() {
            if(document.querySelector('input[name="sessionToggle"]:checked').value === 'Open') {
                openLabel.className = "flex-1 text-center cursor-pointer py-1.5 rounded-md transition-all text-sm font-semibold bg-blue-600 text-white shadow-sm";
                closeLabel.className = "flex-1 text-center cursor-pointer py-1.5 rounded-md transition-all text-sm font-semibold text-slate-600";
            } else {
                closeLabel.className = "flex-1 text-center cursor-pointer py-1.5 rounded-md transition-all text-sm font-semibold bg-blue-600 text-white shadow-sm";
                openLabel.className = "flex-1 text-center cursor-pointer py-1.5 rounded-md transition-all text-sm font-semibold text-slate-600";
            }
        }
        updateToggleUI();

        radioButtons.forEach(radio => {
            radio.addEventListener('change', () => {
                updateToggleUI();
                checkValidationAndStatus();
            });
        });

        document.getElementById('marketDropdown').addEventListener('change', checkOpenStatusAndAutoSwitch);
        document.getElementById('recordDate').addEventListener('change', checkOpenStatusAndAutoSwitch);

        async function checkOpenStatusAndAutoSwitch() {
            let market = document.getElementById('marketDropdown').value;
            let date = document.getElementById('recordDate').value;
            if (!market || !date) return;

            try {
                const q = query(
                    collection(db, "matka_records"),
                    where("date", "==", date),
                    where("marketName", "==", market),
                    where("session", "==", "Open")
                );
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    document.querySelector('input[name="sessionToggle"][value="Close"]').checked = true;
                } else {
                    document.querySelector('input[name="sessionToggle"][value="Open"]').checked = true;
                }
                updateToggleUI();
                checkValidationAndStatus();
            } catch (err) {
                console.log("Auto switch error:", err);
            }
        }

        async function checkValidationAndStatus() {
            let marketName = document.getElementById('marketDropdown').value;
            let dateStr = document.getElementById('recordDate').value;
            let session = document.querySelector('input[name="sessionToggle"]:checked').value;
            let alertBox = document.getElementById('entryAlertBox');
            let alertText = document.getElementById('alertMessageText');
            let submitBtn = document.getElementById('submitBtn');
            let pannaInput = document.getElementById('pannaInput');

            if (!marketName || !dateStr) return;

            const d = new Date(dateStr);
            const daysMap = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const selectedDayShort = daysMap[d.getDay()];

            let selectedMarketObj = marketsList.find(m => m.name === marketName);
            if (selectedMarketObj && selectedMarketObj.workingDays) {
                if (!selectedMarketObj.workingDays.includes(selectedDayShort)) {
                    alertBox.classList.remove('hidden');
                    alertText.innerText = "Market is closed on this day (Non-working day)!";
                    submitBtn.disabled = true;
                    submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    pannaInput.disabled = true;
                    return;
                }
            }

            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            pannaInput.disabled = false;

            try {
                const q = query(
                    collection(db, "matka_records"),
                    where("date", "==", dateStr),
                    where("marketName", "==", marketName),
                    where("session", "==", session)
                );
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    let docId = "";
                    let panaVal = "";
                    querySnapshot.forEach((docSnap) => {
                        docId = docSnap.id;
                        panaVal = session === 'Open' ? docSnap.data().openPana : docSnap.data().closePana;
                    });

                    alertBox.classList.remove('hidden');
                    alertText.innerText = "Duplicate entry check: Record for this session already exists! Switched to Update mode.";
                    document.getElementById('recordId').value = docId;
                    submitBtn.innerText = "Update Record";
                    submitBtn.classList.replace('bg-blue-600', 'bg-emerald-600');
                    document.getElementById('cancelEditBtn').classList.remove('hidden');

                    if (panaVal && pannaInput.value === '') {
                        pannaInput.value = panaVal;
                        pannaInput.dispatchEvent(new Event('input'));
                    }
                } else {
                    alertBox.classList.add('hidden');
                    document.getElementById('recordId').value = '';
                    submitBtn.innerText = "Save Record";
                    submitBtn.classList.replace('bg-emerald-600', 'bg-blue-600');
                    document.getElementById('cancelEditBtn').classList.add('hidden');
                }
            } catch (err) {
                console.log("Check error:", err);
            }
        }

        async function fetchLastEntry() {
            try {
                const q = query(collection(db, "matka_records"), orderBy("timestamp", "desc"), limit(1));
                const querySnapshot = await getDocs(q);
                const detailsBox = document.getElementById('lastEntryDetails');
                
                if (!querySnapshot.empty) {
                    querySnapshot.forEach((docSnap) => {
                        let data = docSnap.data();
                        let sessionVal = data.session || (data.openPana ? 'Open' : 'Close');
                        let pannaVal = sessionVal === 'Open' ? data.openPana : data.closePana;
                        let ankVal = sessionVal === 'Open' ? data.openAnk : data.closeAnk;
                        let familyGroupVal = sessionVal === 'Open' ? (data.openFamilyGroup || '-') : (data.closeFamilyGroup || '-');
                        
                        detailsBox.innerHTML = `Date: ${data.date} | Market: ${data.marketName} | Session: ${sessionVal} | Panna: ${pannaVal} (Ank: ${ankVal}, Family: ${familyGroupVal})`;
                    });
                } else {
                    detailsBox.innerText = "No previous entries found.";
                }
            } catch (error) {
                console.error("Error fetching last entry: ", error);
            }
        }

        fetchLastEntry();

        document.getElementById('cancelEditBtn').addEventListener('click', function() {
            document.getElementById('matkaForm').reset();
            document.getElementById('recordId').value = '';
            document.getElementById('submitBtn').innerText = "Save Record";
            document.getElementById('submitBtn').classList.replace('bg-emerald-600', 'bg-blue-600');
            this.classList.add('hidden');
            document.getElementById('entryAlertBox').classList.add('hidden');
            dateInput.value = new Date().toISOString().split('T')[0];
            document.querySelector('input[name="sessionToggle"][value="Open"]').checked = true;
            updateToggleUI();
            document.getElementById('previewAnk').innerText = '-';
            document.getElementById('previewGroup').innerText = '-';
            document.getElementById('previewFamilyGroup').innerText = '-';
            document.getElementById('previewPanelType').innerText = '-';
        });

        let calculatedAnk = '';
        let detectedPanelType = '';
        let detectedFamilyGroup = '';

        document.getElementById('pannaInput').addEventListener('input', function(e) {
            let panna = e.target.value;
            if (panna.length === 3 && !isNaN(panna)) {
                let sum = parseInt(panna[0]) + parseInt(panna[1]) + parseInt(panna[2]);
                calculatedAnk = sum % 10; 
                
                if (panna[0] === panna[1] && panna[1] === panna[2]) {
                    detectedPanelType = "TP (Triple Panna)";
                } else if (panna[0] === panna[1] || panna[1] === panna[2] || panna[0] === panna[2]) {
                    detectedPanelType = "DP (Double Panna)";
                } else {
                    detectedPanelType = "SP (Single Panna)";
                }

                detectedFamilyGroup = panna.split('').sort().join('');

                document.getElementById('previewAnk').innerText = calculatedAnk;
                document.getElementById('previewGroup').innerText = panna; 
                document.getElementById('previewFamilyGroup').innerText = detectedFamilyGroup;
                document.getElementById('previewPanelType').innerText = detectedPanelType;
            } else {
                calculatedAnk = '';
                detectedPanelType = '';
                detectedFamilyGroup = '';
                document.getElementById('previewAnk').innerText = '-';
                document.getElementById('previewGroup').innerText = '-';
                document.getElementById('previewFamilyGroup').innerText = '-';
                document.getElementById('previewPanelType').innerText = '-';
            }
        });

        document.getElementById('matkaForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            let recordId = document.getElementById('recordId').value;
            let session = document.querySelector('input[name="sessionToggle"]:checked').value;
            let panna = document.getElementById('pannaInput').value;
            let date = document.getElementById('recordDate').value;
            let marketName = document.getElementById('marketDropdown').value;

            if (!marketName) {
                alert("Please select a market!");
                return;
            }

            if (panna.length !== 3 || calculatedAnk === '') {
                alert("Please enter a valid 3-digit panna!");
                return;
            }

            let recordData = {
                date: date,
                marketName: marketName,
                session: session,
                timestamp: serverTimestamp()
            };

            if (session === "Open") {
                recordData.openPana = panna;
                recordData.openAnk = calculatedAnk;
                recordData.openGroup = panna; 
                recordData.openFamilyGroup = detectedFamilyGroup;
                recordData.openType = detectedPanelType;
            } else {
                recordData.closePana = panna;
                recordData.closeAnk = calculatedAnk;
                recordData.closeGroup = panna; 
                recordData.closeFamilyGroup = detectedFamilyGroup;
                recordData.closeType = detectedPanelType;
            }

            try {
                if (recordId) {
                    await updateDoc(doc(db, "matka_records", recordId), recordData);
                    alert("Record updated successfully (Duplicate prevented)!");
                } else {
                    await addDoc(collection(db, "matka_records"), recordData);
                    alert("Record saved successfully!");
                }

                document.getElementById('matkaForm').reset();
                document.getElementById('recordId').value = '';
                document.getElementById('submitBtn').innerText = "Save Record";
                document.getElementById('submitBtn').classList.replace('bg-emerald-600', 'bg-blue-600');
                document.getElementById('cancelEditBtn').classList.add('hidden');
                document.getElementById('entryAlertBox').classList.add('hidden');
                dateInput.value = new Date().toISOString().split('T')[0];
                
                if (session === "Open" && !recordId) {
                    document.querySelector('input[name="sessionToggle"][value="Close"]').checked = true;
                } else {
                    document.querySelector('input[name="sessionToggle"][value="Open"]').checked = true;
                }
                updateToggleUI();

                document.getElementById('previewAnk').innerText = '-';
                document.getElementById('previewGroup').innerText = '-';
                document.getElementById('previewFamilyGroup').innerText = '-';
                document.getElementById('previewPanelType').innerText = '-';
                
                fetchLastEntry();
            } catch (error) {
                alert("Error: " + error.message);
            }
        });
    </script>
</body>
</html>
