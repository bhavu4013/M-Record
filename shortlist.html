<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Game Shortlist Portal</title> 
    <script src="https://cdn.tailwindcss.com"></script> 
</head> 
<body class="bg-slate-100 p-4 min-h-screen flex flex-col items-center justify-between pb-20"> 

<div class="max-w-md w-full bg-white p-6 rounded-xl shadow-lg space-y-4 my-auto"> 
    <h2 class="text-xl font-bold text-center text-slate-800 tracking-wide">🎯 Game Shortlist Portal</h2> 

    <div class="w-full space-y-1"> 
        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider">Select Market</label> 
        <select id="shortlistMarketSelect" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none bg-white font-semibold text-slate-800"> 
            <option value="">All Markets (Merged)</option> 
        </select> 
    </div> 

    <div class="w-full"> 
        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Target Session</label> 
        <div class="flex items-center bg-slate-200 p-1 rounded-lg w-full"> 
            <label class="flex-1 text-center cursor-pointer py-1.5 rounded-md transition-all text-sm font-semibold bg-indigo-600 text-white shadow-sm" id="slOpenLabel"> 
                <input type="radio" name="slSession" value="Open" checked class="hidden"> Open 
            </label> 
            <label class="flex-1 text-center cursor-pointer py-1.5 rounded-md transition-all text-sm font-semibold text-slate-600" id="slCloseLabel"> 
                <input type="radio" name="slSession" value="Close" class="hidden"> Close 
            </label> 
        </div> 
    </div> 

    <div class="space-y-3 pt-2"> 
        <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-xl shadow-sm space-y-2"> 
            <div class="text-xs font-bold text-emerald-700 uppercase">🔥 Recommended Best Anks</div> 
            <div id="bestAnksOutput" class="text-lg font-black text-slate-800 tracking-wider">-</div> 
        </div> 

        <div class="bg-indigo-50 border border-indigo-200 p-4 rounded-xl shadow-sm space-y-2"> 
            <div class="text-xs font-bold text-indigo-700 uppercase">💎 Recommended Family / Jodi Output</div> 
            <div id="bestJodiOutput" class="text-sm font-bold text-slate-800 tracking-wide">-</div> 
        </div> 
    </div> 

    <button type="button" id="generateShortlistBtn" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold text-sm hover:bg-indigo-700 shadow-md transition">Generate Best Output</button> 
</div> 

<!-- Bottom Navigation Bar --> 
<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-lg flex justify-around p-2 max-w-md mx-auto z-40 rounded-t-2xl"> 
    <a href="index.html" class="flex-1 flex flex-col items-center py-2 text-slate-400 font-semibold transition"> 
        <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg> 
        <span class="text-xs">Logger</span> 
    </a> 
    <a href="analysis.html" class="flex-1 flex flex-col items-center py-2 text-slate-400 font-semibold transition"> 
        <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2m0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg> 
        <span class="text-xs">Analysis</span> 
    </a> 
    <a href="shortlist.html" class="flex-1 flex flex-col items-center py-2 text-blue-600 font-bold transition"> 
        <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> 
        <span class="text-xs">Shortlist</span> 
    </a> 
</div> 

<script type="module"> 
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"; 
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"; 

    const firebaseConfig = { 
        apiKey: "AIzaSyC7lVQlcPhEGv2V-UwlQ7d6Dq-eXb8boqQ", 
        authDomain: "m-record-f9c51.firebaseapp.com", 
        projectId: "m-record-f9c51", 
        storageBucket: "m-record-f9c51.firebasestorage.app", 
        messagingSenderId: "479303152172", 
        appId: "1:479303152172:web:3cc53dcecc9e8ce1ebd789" 
    }; 
    const app = initializeApp(firebaseConfig); 
    const db = getFirestore(app); 

    async function loadShortlistMarkets() { 
        const marketSelect = document.getElementById('shortlistMarketSelect'); 
        try { 
            const querySnapshot = await getDocs(collection(db, "markets")); 
            querySnapshot.forEach((docSnap) => { 
                let opt = document.createElement('option'); 
                opt.value = docSnap.data().name; 
                opt.textContent = docSnap.data().name; 
                marketSelect.appendChild(opt); 
            }); 
        } catch (e) { console.log(e); } 
    } 
    loadShortlistMarkets(); 

    document.getElementById('generateShortlistBtn').addEventListener('click', async () => { 
        const selectedMarket = document.getElementById('shortlistMarketSelect').value; 
        const session = document.querySelector('input[name="slSession"]:checked').value; 
        
        let bestAnksOutput = document.getElementById('bestAnksOutput'); 
        let bestJodiOutput = document.getElementById('bestJodiOutput'); 
        
        bestAnksOutput.innerText = "Calculating..."; 
        bestJodiOutput.innerText = "Analyzing patterns..."; 

        try { 
            const querySnapshot = await getDocs(collection(db, "matka_records")); 
            let ankCounts = {}; 
            for(let i=0; i<=9; i++) ankCounts[i] = 0; 

            querySnapshot.forEach((docSnap) => { 
                let data = docSnap.data(); 
                if (selectedMarket === "" || data.marketName === selectedMarket) { 
                    let val = session === 'Open' ? data.openAnk : data.closeAnk; 
                    if (val !== undefined && val !== null && val !== '') { 
                        let num = parseInt(val); 
                        if (!isNaN(num)) ankCounts[num]++; 
                    } 
                } 
            }); 

            let sortedAnks = Object.keys(ankCounts).sort((a, b) => ankCounts[b] - ankCounts[a]); 
            let topRecommended = sortedAnks.slice(0, 3).join(', '); 
            
            bestAnksOutput.innerText = `[ ${topRecommended} ] (Top Frequency)`; 
            bestJodiOutput.innerText = `Recommended Ank combination for ${session}: ${sortedAnks[0]}, ${sortedAnks[1]}`; 
        } catch (e) { 
            bestAnksOutput.innerText = "Error loading data"; 
        } 
    }); 
</script> 
</body> 
</html>
